    /* 사건 표식을 두 번 눌렀을 때 곁에 뜨는 상황 브리핑.
       전체 상황 창의 브리핑과 같은 위계다 — 이름 16 / 요약 14 / 확인용 12, 위험은 기호로. */
    function briefCard(inc) {
      const n = store.officersOf(inc.id).length;
      return `<div class="mp-card mp-brief glass">
        <div class="mp-brief-h">
          <b class="mp-brief-name">${PX.esc(inc.type)}</b>
          <span class="mp-brief-prio">${PX.dot(inc.priority, 7)}<span class="cap sec">${PX.esc(inc.priority)}</span></span>
          <span class="cap sec mono mp-brief-id">${PX.esc(inc.id)}</span>
          <button class="mp-card-x" data-close="brief">${PX.icon('close')}</button>
        </div>
        <div class="mp-brief-sum">${PX.esc(inc.summary)}</div>
        <hr class="hair">
        <div class="mp-brief-meta cap sec">
          <div>${PX.esc(inc.team)} · ${PX.esc(inc.place)}</div>
          <div>${PX.esc(inc.status)} · 투입 ${n}명 · ${PX.esc(inc.reportedAt)} 접수</div>
        </div>
        ${inc.hazards && inc.hazards.length ? `<hr class="hair mp-brief-line">
          <div class="mp-brief-hz">
            <span class="mp-hz-ic" title="위험 요소">${PX.icon('warning')}</span>
            <span class="mp-hz-list">${inc.hazards.map(h => `<span class="cap">${PX.esc(h)}</span>`).join('')}</span>
          </div>` : ''}
      </div>`;
    }
    cardEl.addEventListener('click', e => {
      const b = e.target.closest('[data-close]');
      if (!b) return;
      if (b.dataset.close === 'cam') S.popoverCamera = null; else S.briefIncident = null;
      cardEl.dataset.key = '';
      drawCards();
    });

    // ── AR글래스 캠 ──
    function drawAR() {
      if (S.arMode === 'off') { arEl.innerHTML = ''; arEl.hidden = true; return; }
      arEl.hidden = false;
      if (S.arMode === 'full') {
        arEl.className = 'mp-ar full';
        arEl.innerHTML =
          `<div class="mp-arfeed">${arFeed()}</div>
           <div class="mp-arbar glass">
             ${PX.icon('glasses')}<span class="cap"><b>AR글래스 캠</b></span>
             <button class="mp-pip-btn" data-ar="pip" title="작은 창으로">${PX.icon('restore')}</button>
             <button class="mp-pip-btn" data-ar="off" title="닫고 지도로">${PX.icon('close')}</button>
           </div>`;
      } else {
        arEl.className = 'mp-ar pip';
        arEl.style.setProperty('--pip-w', (tile.isNarrow ? 280 : 360) + 'px');
        arEl.innerHTML =
          `<div class="mp-pip glass">
             <div class="mp-pip-h">${PX.icon('glasses')}<span class="cap"><b>AR글래스 캠</b></span>
               <span class="spacer"></span>
               <button class="mp-pip-btn" data-ar="full" title="작전 지도 전체창으로">${PX.icon('expand')}</button>
               <button class="mp-pip-btn" data-ar="off" title="닫기">${PX.icon('close')}</button>
             </div>
             <div class="mp-arfeed" style="height:${tile.isShort ? 150 : 200}px">${arFeed()}</div>
           </div>`;
      }
    }
    /* 현장 AR 영상 (ARScreen.swift) — 가상 화면이다. 실영상이 아니다.
       영상 안 왼쪽 위 드롭다운으로 시점을 바꾸고, 배터리·좌표·교신 시각을 얹는다. */
    let arPicked = null;
    const arLinked = () => store.officers.filter(o => o.ar !== '미연결');
    function arOfficer() {
      const linked = arLinked();
      return linked.find(o => o.id === arPicked)
        || linked.find(o => o.incidentID === store.selectedIncidentID)
        || linked[0] || null;
    }
    function batteryIcon(v) { return 'battery'; }   // 스프라이트에 단계별 배터리가 없어 한 가지를 쓴다

    function arFeed() {
      const o = arOfficer();
      if (!o) {
        return `<div class="mp-ar-none cap sec">현재 사건에 AR 글래스 연결 인원이 없습니다.</div>`;
      }
      const linked = arLinked();
      const cur = linked.filter(x => x.incidentID === store.selectedIncidentID);
      const others = linked.filter(x => x.incidentID !== store.selectedIncidentID);
      const opt = x => `<button class="mp-ar-opt${x.id === o.id ? ' on' : ''}" data-arpick="${PX.esc(x.id)}">${PX.esc(x.call + ' ' + x.name)}</button>`;
      return `<div class="mp-scene">
          <div class="mp-scene-bg"></div>
          <span class="mp-scene-cross">${PX.icon('plus')}</span>
          <span class="mp-scene-rec cap">
            <i style="background:var(--c-urgent)"></i>
            <b style="color:${o.ar === '연결' ? 'var(--c-urgent)' : '#fff'}">${o.ar === '연결' ? 'REC' : '대기'}</b>
          </span>
          <span class="mp-scene-foot cap">
            <span>X ${Math.round(o.point.x)} · Y ${Math.round(o.point.y)} (가상 좌표)</span>
            <span class="mono">${PX.esc(o.commAt)}</span>
          </span>
          ${o.ar === '두절' ? `<div class="mp-scene-lost">
              ${PX.icon('warning')}
              <b class="lab">영상 신호 없음</b>
              <span class="cap sec">통신 재연결 시도 중 (가상)</span>
            </div>` : ''}
        </div>
        <div class="mp-ar-top">
          <div class="mp-ar-pick" data-armenu="1">
            <span>${PX.esc(o.call + ' ' + o.name)}</span>${PX.icon('chev-ud')}
            <div class="mp-ar-menu glass" hidden>
              ${cur.length ? `<div class="mp-ar-sec cap sec">현재 사건 ${PX.esc(store.selectedIncidentID)}</div>` + cur.map(opt).join('') : ''}
              ${others.length ? `<div class="mp-ar-sec cap sec">다른 사건</div>` + others.map(opt).join('') : ''}
            </div>
          </div>
          <span class="mp-ar-batt cap">${PX.icon(batteryIcon(o.battery))}<span class="mono">${o.battery}%</span></span>
        </div>`;
    }
    arEl.addEventListener('click', e => {
      const pick = e.target.closest('[data-arpick]');
      if (pick) { arPicked = pick.dataset.arpick; drawAR(); return; }
      const menu = e.target.closest('[data-armenu]');
      if (menu) {
        const m = menu.querySelector('.mp-ar-menu');
        m.hidden = !m.hidden;
        return;
      }
      const b = e.target.closest('[data-ar]');
      if (!b) return;
      S.arMode = b.dataset.ar;
      drawAR();
      drawSidebar();
    });

    toggleEl.onclick = () => { S.sidebarOpen = true; drawSidebar(); };

    // ── 전체 다시 그리기 ──
    function drawAll() {
      drawSidebar();
      drawControls();
      drawPlay();
      drawAR();
      drawMarkers();
      drawLines();
      drawPairLabels();
      drawCards();
    }

    // 다른 화면이 사건을 바꾸면 따라간다
    const off = store.subscribe(what => {
      if (what === 'incident') {
        const g = store.caseGroupOf(store.selectedIncidentID);
        if (g && (!S.openedCase || S.openedCase.id !== g.id)) { S.openedCase = g; S.sidebarOpen = true; fitCase(g); }
        retargetClock();
        drawAll();
      } else if (what === 'units') {
        drawAll();
      } else if (what === 'theme') {
        swapStyle(store.darkMode);
      }
    });

    retargetClock();

    return {
      resize(t) {
        tile = t;
        map.resize();
        drawAll();
      },
      destroy() {
        off();
        clock.stop();
        map.remove();
      }
    };
  }

  PX.screens.map = { mount: mount };
})(window.PX);

</script>
<script>
/* ===== screen-space.js ===== */
/* 공간 3D — SpaceScreen.swift + SpaceStage.swift 를 옮긴 것.

   맥 판은 WKWebView 가 SwiftUI 형제 뷰보다 위에 그려지는 탓에 도구들을 AppKit 으로 따로 얹어야 했다.
   웹에서는 그 문제가 없어 그냥 iframe 위에 얹는다. 대신 **자리 규칙은 그대로 옮긴다** —
   모드 줄과 상태 칸을 먼저 놓고, 오른쪽 레일은 그 둘이 비워 둔 띠 안에 앉는다. */
(function (PX) {
  'use strict';

  const SCAN_URL = id => 'https://liakim1804-create.github.io/parallax-console-app/space/room.html?scan=' + encodeURIComponent(id) + '&embed=1&light=1&m=photo';

  function mount(body, ctx) {
    const store = ctx.store;
    let tile = ctx.tile;

    body.classList.add('sp-root');
    body.innerHTML =
      `<iframe class="sp-frame" title="공간 3D"></iframe>
       <div class="sp-modes"></div>
       <div class="sp-rail"></div>
       <div class="sp-chip"></div>`;

    const frame = body.querySelector('.sp-frame');
    const modesEl = body.querySelector('.sp-modes');
    const railEl = body.querySelector('.sp-rail');
    const chipEl = body.querySelector('.sp-chip');

    // ── 상태 (SpaceStageModel) ──
    const m = {
      phase: { kind: 'loading', text: '공간 불러오는 중' },
      view: 'all',
      mode: 'photo',
      cover: null,
      gaps: 0,
      orbit: true,
      cams: false,          // CCTV 시야를 공간 안에 세워 두었는가
      camIDs: [],           // 공간 안에 선 카메라 번호 (3D 가 알려 준다)
      lens: null,           // 그 카메라가 보는 시점으로 들어가 있다면 그 번호
      scanID: PX.data.spaceScan.fallback,
      ownScan: true,
      gapIndex: -1,
      frameLoaded: false,
      pending: []
    };

    // ── 앱 → 3D ──
    function send(msg) {
      if (!m.frameLoaded || !frame.contentWindow) { m.pending.push(msg); return; }
      frame.contentWindow.postMessage(Object.assign({ px: 1 }, msg), '*');
    }
    function scanOf() {
      try { return new URL(frame.src, location.href).searchParams.get('scan'); } catch (e) { return null; }
    }
    /* 사건이 바뀌면 그 현장의 공간 기록으로 갈아 끼운다.
       room.html 은 스캔을 주소에서 읽으므로 새 주소를 넣는 것이 곧 새 공간이다 —
       같은 스캔이면 건드리지 않는다(28MB 를 다시 읽는다). */
    function setScan(inc) {
      const id = PX.data.spaceScan.of(inc);
      m.ownScan = PX.data.spaceScan.isOwn(inc);
      if (id === m.scanID) { drawChip(); return; }
      m.scanID = id;
      m.cams = false; m.camIDs = []; m.lens = null;
      m.cover = null; m.gaps = 0;
      m.frameLoaded = false;
      m.pending.length = 0;
      m.phase = { kind: 'loading', text: '현장 공간 불러오는 중' };
      frame.src = SCAN_URL(id);
      drawAll();
    }

    function setView(v) {
      if (v === 'gap') {
        if (!m.gaps) return;
        m.gapIndex = (m.gapIndex + 1) % m.gaps;
        send({ p: 'view', v: 'gap', i: m.gapIndex });
      } else {
        m.gapIndex = -1;
        send({ p: 'view', v: v });
      }
      m.view = v;
      m.orbit = false;
      send({ p: 'orbit', on: false });
      drawRail();
    }
    function setMode(x) { m.mode = x; send({ p: 'mode', m: x }); drawModes(); }
    function zoom(f) { m.orbit = false; send({ p: 'orbit', on: false }); send({ p: 'zoom', f: f }); drawRail(); }
    function setOrbit(on) { m.orbit = on; send({ p: 'orbit', on: on }); drawRail(); }

    /* 지도의 CCTV 부채꼴을 그대로 공간 안에 세운다.
       좌표는 사건 위치를 원점으로 한 상대 위치만 보낸다. 3D 쪽은 그 방위만 읽어
       카메라를 그 방향의 벽으로 밀어 붙인다 — 길 건너 30m 를 그대로 쓰면 방이 점이 된다.
       축: 우리 지도의 x 는 동쪽, y 는 남쪽. 3D 의 x·z 와 같은 방향이라 방위각에서 90도만 빼면 yaw 가 된다. */
    function setCams(on) {
      m.cams = on;
      if (!on) {
        m.camIDs = []; m.lens = null;
        send({ p: 'cctv', on: false });
        drawAll();
        return;
      }
      const inc = store.selectedIncident;
      const list = store.camerasOf(store.selectedIncidentID).map(c => ({
        id: c.id, label: c.id,
        x: c.point.x - inc.point.x,        // 동쪽(+)
        z: c.point.y - inc.point.y,        // 남쪽(+)
        yaw: c.facing - 90,
        fov: c.fov, range: c.range,
        h: 3.4                             // 전주 설치 높이 ≈ 3.4m
      }));
      // 부채꼴 색은 앱 강조색을 따라간다 — 3D 안에서만 다른 파랑이 쓰이면 따로 논다
      const tint = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#007aff';
      send({ p: 'cctv', on: true, key: tint, list: list });
      drawAll();
    }
    function toggleLens(id) {
      if (m.lens === id) { leaveLens(); return; }
      send({ p: 'lens', id: id });
      m.lens = id;
      drawAll();
    }
    function leaveLens() { send({ p: 'lens', id: '' }); m.lens = null; drawAll(); }

    // ── 3D → 앱 ──
    function onMessage(e) {
      if (e.source !== frame.contentWindow) return;
      const d = e.data;
      if (!d || d.px !== 1) return;
      switch (d.p) {
        case 'load': m.phase = { kind: 'loading', text: d.t || '공간 불러오는 중' }; drawChip(); break;
        case 'err': m.phase = { kind: 'failed', text: d.t || '공간을 못 읽었습니다' }; drawChip(); break;
        case 'ready':
          m.mode = d.mode || m.mode;
          m.cover = typeof d.cover === 'number' ? d.cover : null;
          m.gaps = d.gaps || 0;
          m.phase = { kind: 'ready' };
          send({ p: 'orbit', on: true });
          drawAll();
          break;
        case 'mode': m.mode = d.m || m.mode; drawModes(); break;
        case 'cctv':
          // 3D 가 실제로 세운 카메라 — 스캔이 작아 못 세운 것이 있을 수 있으니 그쪽 말을 따른다
          m.camIDs = d.ids || [];
          drawAll();
          break;
        case 'lens':
          // 3D 안의 이름표를 눌러 들어갈 수도 있다 — 그때도 단추가 함께 켜지게 받는다
          m.lens = d.id ? d.id : null;
          drawAll();
          break;
        case 'touch':
          // 3D 안을 손으로 건드렸다 — 고른 보기를 푼다 (자동 회전은 room.html 이 되살린다)
          m.view = null;
          drawRail();
          break;
      }
    }
    window.addEventListener('message', onMessage);

    frame.addEventListener('load', () => {
      const loaded = scanOf();
      // 올라온 스캔이 원하던 것과 다르면 여기서 한 번 더 바꾼다
      if (loaded && loaded !== m.scanID) {
        m.frameLoaded = false;
        m.phase = { kind: 'loading', text: '현장 공간 불러오는 중' };
        frame.src = SCAN_URL(m.scanID);
        drawChip();
        return;
      }
      m.frameLoaded = true;
      /* iframe 은 마우스 이동을 저 혼자 먹는다 — 그러면 창 이름표·단추와 아래쪽 독이
         3D 위에서는 영영 안 뜬다. 안에서 받은 이동을 바깥 좌표로 바꿔 다시 쏴 준다.
         (다른 출처로 열렸으면 접근이 막히므로 조용히 넘어간다) */
      try {
        frame.contentDocument.addEventListener('mousemove', ev => {
          const r = frame.getBoundingClientRect();
          frame.dispatchEvent(new MouseEvent('mousemove', {
            bubbles: true, clientX: r.left + ev.clientX, clientY: r.top + ev.clientY
          }));
        });
      } catch (e) { /* 파일로 열었을 때는 막힐 수 있다 */ }
      send({ p: 'orbit', on: true });     // 천천히 저절로 돈다
      const queued = m.pending.slice();
      m.pending.length = 0;
      queued.forEach(send);
    });

    // ── 그리기 ──
    const cams = () => store.camerasOf(store.selectedIncidentID);
    /** 3D 가 실제로 세운 것을 우선한다 — 대답이 오기 전에는 우리 목록을 그대로 쓴다 */
    const lensIDs = () => (m.camIDs.length ? m.camIDs : cams().map(c => c.id));
    /* 글자를 떼고 그림씨만 남길 때. 좁을 때뿐 아니라 낮을 때도 떼어야
       레일이 가늘어져 모드 줄·상태 칸과 겹치지 않는다 */
    const railCompact = () => tile.isTiny || tile.isShort;

    function railBtn(label, icon, on, act, extra) {
      return `<button class="sp-btn${on ? ' on' : ''}${railCompact() ? ' compact' : ''}"
                data-act="${act}"${extra || ''} title="${PX.esc(label)}">
                ${PX.icon(icon)}${railCompact() ? '' : `<span>${PX.esc(label)}</span>`}</button>`;
    }

    function drawRail() {
      const groups = [];
      let viewRows =
        railBtn('전체', 'cube', m.view === 'all', 'view:all') +
        railBtn('위', 'to-bottom', m.view === 'top', 'view:top') +
        railBtn('옆', 'to-right', m.view === 'side', 'view:side');
      // 낮은 창에서는 줄 수를 줄여야 레일이 위아래로 넘치지 않는다
      if (m.gaps > 0 && !tile.isShort) viewRows += railBtn('빈 곳', 'dash', m.view === 'gap', 'view:gap');
      groups.push(`<div class="sp-group">${viewRows}</div>`);

      // CCTV — 켜면 시야 부채꼴이 공간 안에 서고, 카메라마다 그 시점으로 들어갈 수 있다
      if (cams().length) {
        let rows = railBtn('CCTV', 'cctv', m.cams, 'cams');
        // 시점 단추는 자리를 많이 먹는다 — 낮은 창에서는 부채꼴만 남긴다
        if (m.cams && !tile.isShort) {
          rows += lensIDs().map(id =>
            railBtn(id, m.lens === id ? 'eye-fill' : 'eye', m.lens === id, 'lens', ` data-id="${PX.esc(id)}"`)
          ).join('');
        }
        groups.push(`<div class="sp-group">${rows}</div>`);
      }

      if (!tile.isShort) {
        groups.push(`<div class="sp-group">
          <button class="sp-btn compact" data-act="zoomin" title="확대">${PX.icon('zoom-in')}</button>
          <button class="sp-btn compact" data-act="zoomout" title="축소">${PX.icon('zoom-out')}</button>
          <button class="sp-btn compact" data-act="orbit" title="자동 회전">${PX.icon(m.orbit ? 'pause' : 'orbit')}</button>
        </div>`);
      }
      railEl.innerHTML = groups.join('');
      layout();
    }

    function drawModes() {
      const b = (label, icon, id) =>
        `<button class="sp-mode${m.mode === id ? ' on' : ''}" data-mode="${id}" title="${PX.esc(label)}">
           ${tile.isTiny ? PX.icon(icon) : PX.esc(label)}</button>`;
      modesEl.innerHTML = b('실제 색', 'photo', 'photo') + b('히트맵', 'flame', 'heat') + b('남은 곳', 'dash', 'left');
      layout();
    }

    function drawChip() {
      let inner;
      if (m.phase.kind === 'loading') {
        inner = `<span class="sp-spin"></span><span class="cap">${PX.esc(m.phase.text)}</span>`;
      } else if (m.phase.kind === 'failed') {
        inner = `${PX.icon('warning', 'sp-warn')}<span class="cap">${PX.esc(m.phase.text)}</span>`;
      } else if (m.lens) {
        // 카메라 시점에 들어가 있으면 그것부터 말한다 —
        // 지금 보고 있는 것은 방이 아니라 그 카메라가 잡는 화면이다
        inner = `${PX.icon('eye-fill', 'sp-accent')}<span class="cap sp-strong">${PX.esc(m.lens)} 시점</span>
                 <button class="sp-exit cap sec" data-act="leave">나가기</button>`;
      } else {
        inner = PX.icon('cube') + (tile.isTiny ? '' : `<span class="cap sp-strong">공간 기록</span>`);
        if (m.cover != null) inner += `<span class="cap sec">탐색 ${Math.round(m.cover * 100)}%</span>`;
        // 곁가지 숫자는 자리가 넉넉할 때만. 칸이 좁으면 오른쪽 레일과 부딪친다
        if (!tile.isNarrow && !tile.isShort) {
          if (m.gaps > 0) inner += `<span class="cap sec">안 본 곳 ${m.gaps}곳</span>`;
          if (m.cams) inner += `<span class="cap sec">CCTV ${lensIDs().length}대</span>`;
        }
        // 이 현장을 직접 스캔한 것이 아니면 밝힌다 — 없는 것을 있는 척하지 않는다
        if (!m.ownScan) {
          inner += `<span class="sp-rep cap" title="이 사건의 현장이 아니라 성격이 비슷한 공간을 대신 띄웁니다">대표 공간</span>`;
        }
      }
      chipEl.innerHTML = inner;
      layout();
    }

    function drawAll() { drawRail(); drawModes(); drawChip(); }

    /* 자리 맞추기 (SpaceHostView.layout).
       모드 줄과 상태 칸을 먼저 놓고, 오른쪽 레일은 그 둘이 비워 둔 띠 안에 앉는다.
       들어갈 자리가 아예 없으면 숨긴다 — 반쯤 잘려 보이거나 남의 자리를 덮는 것보다 낫다. */
    function layout() {
      const M = 12;
      /* 창 이름표(왼쪽)와 단추(오른쪽) 알약이 위쪽 띠에 뜬다.
         모드 줄은 그 **둘과 같은 줄**에 세우고(윗변을 맞춘다), 오른쪽 레일만 띠 아래로 내린다. */
      const CHROME = 46;
      const MODES_TOP = 8;
      const W = body.clientWidth, H = body.clientHeight;
      if (!W || !H) return;

      modesEl.hidden = false; railEl.hidden = false; chipEl.hidden = false;
      const mw = modesEl.offsetWidth, mh = modesEl.offsetHeight;
      const cw = chipEl.offsetWidth, ch = chipEl.offsetHeight;
      const rw = railEl.offsetWidth, rh = railEl.offsetHeight;

      const room = { w: W - M * 2, h: H - M * 2 };
      // 모드 줄: 가운데 위
      if (mw > room.w || mh > H - MODES_TOP - M) modesEl.hidden = true;
      else {
        modesEl.style.left = Math.max(M, (W - mw) / 2) + 'px';
        modesEl.style.top = MODES_TOP + 'px';
      }
      // 상태 칸: 왼쪽 아래
      if (cw > room.w || ch > room.h) chipEl.hidden = true;
      else {
        chipEl.style.left = M + 'px';
        chipEl.style.top = (H - M - ch) + 'px';
      }
      // 오른쪽 레일: 남은 띠 안에서 가운데
      const x = W - M - rw;
      // 레일은 오른쪽 가장자리라 단추 알약 바로 아래에서 시작한다
      let top = CHROME, bottom = H - M;
      if (!modesEl.hidden && (Math.max(M, (W - mw) / 2) + mw) > x - 8) top = Math.max(top, MODES_TOP + mh + 8);
      if (!chipEl.hidden && (M + cw) > x - 8) bottom = Math.min(bottom, H - M - ch - 8);
      if (rw > room.w || rh > Math.min(room.h, bottom - top)) railEl.hidden = true;
      else {
        railEl.style.left = x + 'px';
        railEl.style.top = Math.min(Math.max((H - rh) / 2, top), bottom - rh) + 'px';
      }
    }

    // ── 누름 처리 ──
    railEl.addEventListener('click', e => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      const a = b.dataset.act;
      if (a.indexOf('view:') === 0) setView(a.slice(5));
      else if (a === 'cams') setCams(!m.cams);
      else if (a === 'lens') toggleLens(b.dataset.id);
      else if (a === 'zoomin') zoom(1.25);
      else if (a === 'zoomout') zoom(0.8);
      else if (a === 'orbit') setOrbit(!m.orbit);
    });
    modesEl.addEventListener('click', e => {
      const b = e.target.closest('[data-mode]');
      if (b) setMode(b.dataset.mode);
    });
    chipEl.addEventListener('click', e => {
      if (e.target.closest('[data-act="leave"]')) leaveLens();
    });

    // 사건을 바꾸면 그 현장의 공간 기록으로 갈아 끼우고, CCTV 도 그 현장 것으로 바꾼다.
    // 공간을 새로 읽으면 CCTV 가 꺼지므로 켜 두었는지는 바꾸기 전에 기억해 둔다
    const off = store.subscribe(what => {
      if (what !== 'incident') return;
      const wasOn = m.cams;
      setScan(store.selectedIncidentID);
      if (wasOn) setCams(true);
    });

    frame.src = SCAN_URL(PX.data.spaceScan.of(store.selectedIncidentID));
    m.scanID = PX.data.spaceScan.of(store.selectedIncidentID);
    m.ownScan = PX.data.spaceScan.isOwn(store.selectedIncidentID);
    drawAll();

    return {
      resize(t) { tile = t; drawAll(); },
      destroy() {
        off();
        window.removeEventListener('message', onMessage);
        frame.src = 'about:blank';
      }
    };
  }

  PX.screens.space = { mount: mount };
})(window.PX);

</script>
<script>
/* ===== screen-transmit.js ===== */
/* 현장 정보 전송 창 (MessagesScreen.swift 를 옮긴 것)
   메시지·긴급 알림: 받는 대상 알약 + 말풍선 + 작성 칸 (웹 판과 같은 구성)

   SwiftUI 는 @State/@Published 가 바뀌면 저절로 다시 그리지만 여기서는 그런 것이 없어,
   상태를 바꾼 뒤 직접 draw() 를 부르고 다른 창이 바꾼 것은 store.subscribe 로 받는다. */
(function (PX) {
  'use strict';

  /** 중요도 세 가지 (MessageKind) */
  const KINDS = ['일반', '중요', '긴급'];

  /** 중요도 색: 긴급 빨강 · 중요 주황 (일반은 표시하지 않는다) */
  const kindCls = k => (k === '긴급' ? 'urgent' : 'caution');

  PX.screens.transmit = {
    mount(bodyEl, ctx) {
      const store = ctx.store;
      let tile = ctx.tile || PX.tile(400, 300);

      // ── 화면 상태 (@State) ──
      let targetID = null;          // 고른 대상 id (없으면 첫 번째로 떨어진다)
      let kind = '일반';            // 보낼 중요도
      let showAlerts = false;       // 종 단추: 대화 대신 알림 기록
      let lastCount = store.messages.length;   // 메시지가 늘면 맨 아래로 내린다
      let composerKey = null;       // 입력칸이 지금 어느 대상의 임시 입력을 들고 있나

      // ── 대상 목록 ──
      const groups = () => store.chatTargets;
      const allTargets = () => groups().reduce((a, g) => a.concat(g.targets), []);
      // Swift 와 같다: 고른 id 가 없어졌으면 첫 번째 대상으로 떨어진다 (id 자체는 그대로 둔다)
      const target = () => {
        const all = allTargets();
        return all.find(t => t.id === targetID) || all[0] || null;
      };

      // ── 뼈대 (한 번만 만든다. 입력칸을 다시 만들면 치던 글과 커서가 날아간다) ──
      const root = PX.el(
        `<div class="tx-root">
           <div class="tx-head">
             <button class="tx-dd tx-dd-target" type="button" aria-haspopup="true">
               <span class="tx-dd-label"></span>${PX.icon('chev-ud', 'tx-dd-chev')}
             </button>
             <div class="tx-head-gap"></div>
             <button class="tx-bell" type="button" title="알림 기록">
               ${PX.icon('bell')}<span class="tx-badge" hidden></span>
             </button>
           </div>

           <div class="tx-thread"><div class="tx-list"></div></div>

           <div class="tx-composer-wrap">
             <div class="tx-composer">
               <button class="tx-dd tx-kind" type="button" aria-haspopup="true">
                 <span class="tx-dd-label">일반</span>${PX.icon('chev-ud', 'tx-dd-chev')}
               </button>
               <div class="tx-input-row">
                 <textarea class="tx-input" rows="1" spellcheck="false"></textarea>
                 <button class="tx-send" type="button" title="보내기">${PX.icon('arrow-up')}</button>
               </div>
             </div>
           </div>

           <div class="tx-alerts"></div>
         </div>`);
      bodyEl.appendChild(root);

      const ddTarget = root.querySelector('.tx-dd-target');
      const ddTargetLabel = ddTarget.querySelector('.tx-dd-label');
      const ddKind = root.querySelector('.tx-kind');
      const ddKindLabel = ddKind.querySelector('.tx-dd-label');
      const bellBtn = root.querySelector('.tx-bell');
      const badgeEl = root.querySelector('.tx-badge');
      const threadEl = root.querySelector('.tx-thread');
      const listEl = root.querySelector('.tx-list');
      const alertsEl = root.querySelector('.tx-alerts');
      const inputEl = root.querySelector('.tx-input');
      const sendBtn = root.querySelector('.tx-send');

      // ══ 드롭다운 ══════════════════════════════════════════════
      // macOS 기본 피커는 창 안에서 왼쪽 여백이 제각각이고 어두운 배경 위에서 글자가 묻혀서,
      // Swift 판(GlassDropdown)처럼 라벨을 직접 그린다. <select> 를 쓰면 화살표가 하나 더 생긴다.
      let menuEl = null;
      let menuOwner = null;

      function closeMenu() {
        if (menuEl) { menuEl.remove(); menuEl = null; }
        if (menuOwner) { menuOwner.classList.remove('open'); menuOwner = null; }
      }

      /** items: {kind:'section'|'item'|'none', label, value}[] */
      function openMenu(items, onPick, opts) {
        const wasOwner = menuOwner;
        closeMenu();
        if (opts.anchor && wasOwner === opts.anchor) return;   // 같은 단추를 다시 누르면 닫기

        menuEl = PX.el('<div class="tx-menu glass"></div>');
        items.forEach(it => {
          if (it.kind === 'section') {
            menuEl.appendChild(PX.el(`<div class="tx-menu-sec">${PX.esc(it.label)}</div>`));
          } else if (it.kind === 'none') {
            menuEl.appendChild(PX.el(`<div class="tx-menu-none">${PX.esc(it.label)}</div>`));
          } else {
            const b = PX.el(`<button class="tx-menu-item${it.on ? ' on' : ''}" type="button">${PX.esc(it.label)}</button>`);
            b.onclick = ev => { ev.stopPropagation(); closeMenu(); onPick(it.value); };
            menuEl.appendChild(b);
          }
        });
        root.appendChild(menuEl);

        // 창 안쪽(overflow:hidden)을 넘지 않게 자리를 잡는다. 아래가 좁으면 위로 편다
        const rb = root.getBoundingClientRect();
        const mw = menuEl.offsetWidth, mh = menuEl.offsetHeight;
        let left, top;
        if (opts.anchor) {
          const ab = opts.anchor.getBoundingClientRect();
          left = ab.left - rb.left;
          const below = rb.bottom - ab.bottom - 6;
          const above = ab.top - rb.top - 6;
          if (mh <= below || below >= above) {
            top = ab.bottom - rb.top + 4;
            menuEl.style.maxHeight = Math.max(80, below - 4) + 'px';
          } else {
            top = Math.max(4, ab.top - rb.top - 4 - Math.min(mh, above));
            menuEl.style.maxHeight = Math.max(80, above - 4) + 'px';
          }
          if (opts.matchWidth) menuEl.style.minWidth = ab.width + 'px';
        } else {
          left = opts.x - rb.left;
          top = opts.y - rb.top;
          if (top + mh > rb.height - 4) top = Math.max(4, rb.height - mh - 4);
          menuEl.style.maxHeight = Math.max(80, rb.height - 8) + 'px';
        }
        menuEl.style.left = PX.clamp(left, 4, Math.max(4, rb.width - mw - 4)) + 'px';
        menuEl.style.top = top + 'px';

        if (opts.anchor) { menuOwner = opts.anchor; menuOwner.classList.add('open'); }
      }

      const onDocDown = e => { if (menuEl && !menuEl.contains(e.target) && e.target !== menuOwner && !(menuOwner && menuOwner.contains(e.target))) closeMenu(); };
      const onKeyDown = e => { if (e.key === 'Escape') closeMenu(); };
      document.addEventListener('mousedown', onDocDown, true);
      document.addEventListener('keydown', onKeyDown, true);

      // 받는 대상 고르기 — 묶음(현장팀/후속팀/상황실 내부)별로 나눠 보여 준다
      ddTarget.onclick = () => {
        const items = [];
        groups().forEach(g => {
          if (!g.targets.length) {
            // 등록된 대상이 없는 묶음도 숨기지 않고 그대로 알린다
            items.push({ kind: 'none', label: g.title + ' · 등록된 대상 없음' });
          } else {
            items.push({ kind: 'section', label: g.title });
            const cur = target();
            g.targets.forEach(t => items.push({ kind: 'item', label: t.label, value: t.id, on: cur && cur.id === t.id }));
          }
        });
        openMenu(items, id => { targetID = id; draw(); }, { anchor: ddTarget, matchWidth: true });
      };

      ddKind.onclick = () => {
        openMenu(KINDS.map(k => ({ kind: 'item', label: k, value: k, on: k === kind })),
                 k => { kind = k; draw(); }, { anchor: ddKind, matchWidth: true });
      };

      // ── 알림 종 ──
      bellBtn.onclick = () => {
        showAlerts = !showAlerts;
        if (showAlerts) store.markAllAlertsSeen();
        closeMenu();
        draw();
      };

      // ══ 대화 내역 ═════════════════════════════════════════════
      function bubbleHTML(m) {
        const mine = !!m.isMine;
        const meta = [];

        if (m.kind !== '일반') {
          meta.push(
            `<span class="tx-kindchip ${kindCls(m.kind)}">` +
            `<span class="dot ${kindCls(m.kind)}"></span>` +
            `<span class="tx-kindtext">${PX.esc(m.kind)}</span></span>`);
        }
        meta.push(`<span class="tx-from">${PX.esc(m.from)}</span>`);
        // 좁으면 보낸 쪽만 남긴다 — 받는 쪽은 위 드롭다운에 이미 있다
        meta.push(`<span class="tx-arrow">→</span><span class="tx-to">${PX.esc(m.to)}</span>`);
        if (m.isPinned) meta.push(PX.icon('pushpin', 'tx-pin'));

        const state = mine ? (m.isRead ? '확인' : '전송됨') : (m.isRead ? '확인' : '미확인');
        const readBtn = (!mine && !m.isRead)
          ? `<button class="tx-readbtn" type="button" data-read="${PX.esc(m.id)}">확인</button>` : '';

        return `<div class="tx-row ${mine ? 'mine' : 'theirs'}">
            <div class="tx-bubble${m.isPinned ? ' pinned' : ''}" data-msg="${PX.esc(m.id)}">
              <div class="tx-meta">${meta.join('')}</div>
              <div class="tx-text">${PX.esc(m.text)}</div>
              <div class="tx-foot">
                <span class="mono">${PX.esc(m.time)}</span>
                <span>${PX.esc(state)}</span>${readBtn}
              </div>
            </div>
          </div>`;
      }

      function drawThread() {
        const t = target();
        const keep = threadEl.scrollTop;
        let html = '';
        if (!t) {
          html = '<div class="tx-empty">이 팀에 등록된 대상이 없습니다.</div>';
        } else {
          const list = store.thread(t);
          if (!list.length) {
            html = `<div class="tx-empty">${PX.esc(t.label)} 와(과) 주고받은 메시지가 없습니다.</div>`;
          }
          html += list.map(bubbleHTML).join('');
        }
        listEl.innerHTML = html;

        // 메시지가 늘었을 때만 맨 아래로 (Swift 의 onChange(of: messages.count) + withAnimation).
        // 그 밖에는 보던 자리를 지킨다 — 다시 그릴 때마다 목록이 맨 위로 튀면 읽을 수가 없다
        if (store.messages.length !== lastCount) {
          lastCount = store.messages.length;
          threadEl.scrollTo({ top: threadEl.scrollHeight, behavior: 'smooth' });
        } else {
          threadEl.scrollTop = keep;
        }
      }

      // 말풍선: 확인 단추 · 오른쪽 단추(고정/확인 처리) — Swift 의 .contextMenu
      listEl.addEventListener('click', e => {
        const b = e.target.closest('[data-read]');
        if (b) store.markRead(b.getAttribute('data-read'));
      });
      listEl.addEventListener('contextmenu', e => {
        const b = e.target.closest('[data-msg]');
        if (!b) return;
        e.preventDefault();
        const id = b.getAttribute('data-msg');
        const m = store.messages.find(x => x.id === id);
        if (!m) return;
        const items = [{ kind: 'item', label: m.isPinned ? '고정 해제' : '고정', value: 'pin' }];
        if (!m.isMine && !m.isRead) items.push({ kind: 'item', label: '확인 처리', value: 'read' });
        openMenu(items, v => { if (v === 'pin') store.togglePin(id); else store.markRead(id); },
                 { x: e.clientX, y: e.clientY });
      });

      // ══ 알림 기록 ═════════════════════════════════════════════
      function drawAlerts() {
        if (!store.alerts.length) {
          alertsEl.innerHTML = '<div class="tx-empty">알림 기록이 없습니다.</div>';
          return;
        }
        alertsEl.innerHTML = store.alerts.map((a, i) => (
          `<div class="tx-alert">
             ${PX.dot(a.level)}
             <div class="tx-alert-body">
               <div class="tx-alert-head">
                 <span class="tx-alert-title${a.seen ? '' : ' unseen'}">${PX.esc(a.title)}</span>
                 <span class="tx-alert-time cap sec">${PX.esc(a.time)}</span>
               </div>
               <div class="tx-alert-detail${a.seen ? ' seen' : ''}">${PX.esc(a.detail)}</div>
             </div>
           </div>` + (i < store.alerts.length - 1 ? '<hr class="hair">' : '')
        )).join('');
      }

      // ══ 작성 칸 ═══════════════════════════════════════════════
      function placeholder(t) {
        // 안내 문구가 길면 칸이 밀려 보내기 단추가 잘린다 — 좁을수록 짧게
        if (!t) return tile.isNarrow ? '대상 선택' : '받는 대상을 먼저 선택하십시오.';
        return tile.isVeryNarrow ? '내용' : (tile.isNarrow ? '내용 입력' : '내용을 입력하십시오.');
      }

      const draftOf = t => (t ? (store.drafts[t.id] || '') : '');
      const canSend = () => { const t = target(); return !!t && draftOf(t).trim().length > 0; };

      /** 줄 수는 낮은 창에서 2줄, 아니면 4줄까지만 늘어난다 (Swift lineLimit) */
      function autoGrow() {
        const max = (tile.isShort ? 2 : 4) * 19 + 16;
        inputEl.style.height = 'auto';
        inputEl.style.height = Math.min(inputEl.scrollHeight, max) + 'px';
      }

      function syncComposer() {
        const t = target();
        const key = t ? t.id : '';
        inputEl.placeholder = placeholder(t);
        inputEl.disabled = !t;
        // 임시 입력은 대상마다 따로 남는다. 대상이 바뀌었을 때만 칸을 갈아 끼운다
        if (composerKey !== key || document.activeElement !== inputEl) {
          inputEl.value = draftOf(t);
          composerKey = key;
        }
        autoGrow();
        ddKindLabel.textContent = kind;
        const ok = canSend();
        sendBtn.disabled = !ok;
        sendBtn.classList.toggle('urgent', ok && kind === '긴급');
      }

      function doSend() {
        const t = target();
        if (!t || !canSend()) return;
        store.send(t, store.drafts[t.id] || '', kind);
        inputEl.value = '';
        autoGrow();
      }

      inputEl.addEventListener('input', () => {
        const t = target();
        // 임시 입력은 store 에 둔다 — 대상을 바꿔도 남아야 한다.
        // 글자마다 emit 하지는 않는다. drafts 를 보는 창이 이 화면뿐이라 다른 창을 깨울 일이 없다
        if (t) store.drafts[t.id] = inputEl.value;
        autoGrow();
        const ok = canSend();
        sendBtn.disabled = !ok;
        sendBtn.classList.toggle('urgent', ok && kind === '긴급');
      });
      inputEl.addEventListener('keydown', e => {
        // Swift 의 onSubmit. 한글을 조합하는 중(isComposing)에 누른 Enter 는 글자를 맺는 것이지
        // 보내라는 뜻이 아니다 — 그냥 보내면 낱자만 들어간 채로 나간다
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
          e.preventDefault();
          doSend();
        }
      });
      sendBtn.onclick = doSend;

      // ══ 창 크기 ═══════════════════════════════════════════════
      function applyTile() {
        root.classList.toggle('narrow', tile.isNarrow);
        root.classList.toggle('vnarrow', tile.isVeryNarrow);
        root.classList.toggle('tiny', tile.isTiny);
        root.classList.toggle('short', tile.isShort);
        root.classList.toggle('vshort', tile.isVeryShort);   // 낮으면 중요도 고르기를 접는다
        // 받는 대상 드롭다운 너비 · 말풍선 바깥 여백은 Swift 와 같은 값
        root.style.setProperty('--tx-dd-w', (tile.isVeryNarrow ? 140 : (tile.isNarrow ? 180 : 260)) + 'px');
        root.style.setProperty('--tx-kind-w', (tile.isVeryNarrow ? 78 : 92) + 'px');
        root.style.setProperty('--tx-gutter', (tile.isVeryNarrow ? 8 : (tile.isNarrow ? 16 : 40)) + 'px');
      }

      // ══ 전체 그리기 ═══════════════════════════════════════════
      function draw() {
        applyTile();
        const t = target();
        ddTargetLabel.textContent = t ? t.label : '받는 대상 선택';

        const n = store.unseenAlertCount;
        badgeEl.hidden = n <= 0;
        badgeEl.textContent = n;
        bellBtn.classList.toggle('on', showAlerts);
        root.classList.toggle('alerts', showAlerts);

        if (showAlerts) {
          drawAlerts();
        } else {
          drawThread();
          syncComposer();
        }
      }

      draw();
      threadEl.scrollTop = threadEl.scrollHeight;

      const off = store.subscribe(() => { draw(); });

      return {
        resize(t) { tile = t; applyTile(); if (!showAlerts) { syncComposer(); } closeMenu(); },
        destroy() { off(); closeMenu();
          document.removeEventListener('mousedown', onDocDown, true);
          document.removeEventListener('keydown', onKeyDown, true); }
      };
    }
  };
})(window.PX);

</script>
<script>
/* ===== screen-handover.js ===== */
/* 기록·회의록 (HandoverScreen.swift) + 사건 처리 단계 (ProgressScreen.swift)
   일반 <script> 로 불린다 (ES module 아님).

   SwiftUI 는 @EnvironmentObject 가 바뀌면 body 를 저절로 다시 그리지만 여기서는 그런 것이 없어,
   store.subscribe() 로 바뀜을 듣고 그때마다 다시 그린다.
   다시 그릴 때 스크롤 위치가 맨 위로 튀지 않도록 scrollTop 을 가지고 있다가 되돌려 준다. */
(function (PX) {
  'use strict';

  var store = PX.store;
  var esc = PX.esc;

  /** 사건 하나의 조치 기록 줄 — Swift: officers(of:).map { "\(call) · \(task)" } */
  function actionsOf(incID) {
    return store.officersOf(incID).map(function (o) { return o.call + ' · ' + o.task; });
  }

  // ══════════════════════════════════════════════════════════════
  //  기록·회의록 — 조치 기록과 회의록 요약
  // ══════════════════════════════════════════════════════════════
  PX.screens.handover = {
    mount: function (body, ctx) {
      var tile = ctx.tile;
      var root = PX.el('<div class="ho-root"><div class="ho-scroll"><div class="ho-pad"></div></div></div>');
      body.appendChild(root);
      var scroll = root.querySelector('.ho-scroll');
      var pad = root.querySelector('.ho-pad');

      // 체크 단추가 누른 줄을 다시 찾을 수 있도록, 마지막으로 그린 목록을 들고 있는다
      var actions = [];

      function render() {
        var inc = store.selectedIncident;
        var stages = PX.data.stages;
        var at = store.stageOf(inc.id);
        var units = store.officersOf(inc.id);
        actions = actionsOf(inc.id);

        var keep = scroll.scrollTop;

        // 창 크기에 따라 달라지는 값만 인라인으로 준다 (TileMetrics.inset / blockGap)
        pad.style.padding = tile.inset + 'px';
        pad.style.gap = tile.blockGap + 'px';

        var h = [];

        // ── 머리 (사건 이름과 담당) ──
        h.push('<div class="ho-head">');
        h.push('<div class="ho-title">' + PX.dot(inc.priority, 9) +
               '<span class="ho-id">' + esc(inc.id + ' ' + inc.type) + '</span></div>');
        h.push('<div class="cap sec">' + esc('담당 ' + inc.team + ' · ' + inc.place) + '</div>');
        h.push('</div>');

        h.push('<hr class="hair">');

        // ── 조치 기록 ──
        h.push('<div class="ho-sec"><div class="ho-h2">조치 기록</div>');
        if (actions.length) {
          actions.forEach(function (a, i) {
            var done = store.handoverDone.has(a);
            h.push('<div class="ho-row">' +
              '<button type="button" class="ho-chk' + (done ? ' on' : '') + '" data-i="' + i + '"' +
              ' aria-pressed="' + (done ? 'true' : 'false') + '"' +
              ' title="' + (done ? '완료 취소' : '완료로 표시') + '">' +
              (done ? PX.icon('check') : '') + '</button>' +
              '<span class="ho-act' + (done ? ' done' : '') + '">' + esc(a) + '</span>' +
              '</div>');
          });
        } else {
          h.push('<div class="cap sec">등록된 조치가 없습니다.</div>');
        }
        h.push('</div>');

        h.push('<hr class="hair">');

        // ── 회의록 요약 ──
        h.push('<div class="ho-sec"><div class="ho-h2">회의록 요약</div>');
        h.push('<div class="ho-sum">' + esc(inc.summary) + '</div>');
        if (inc.hazards && inc.hazards.length) {
          // 「위험 요소」 뒤의 두 칸은 Swift 원문 그대로다. HTML 은 빈칸을 하나로 합치므로 &#160; 으로 둔다
          h.push('<div class="ho-haz">' + PX.dot('주의', 7) +
                 '<span class="cap sec">위험 요소&#160;&#160;' + esc(inc.hazards.join(' · ')) + '</span></div>');
        }
        h.push('<div class="cap sec">' +
               esc('처리 단계 ' + stages[at] + ' ' + (at + 1) + '/' + stages.length +
                   ' · 투입 ' + units.length + '명') + '</div>');
        h.push('</div>');

        pad.innerHTML = h.join('');
        scroll.scrollTop = keep;
      }

      // 체크 단추 — 줄 글자 자체를 열쇠로 쓴다 (Swift 의 handoverDone 도 문자열 Set 이다)
      scroll.addEventListener('click', function (e) {
        var b = e.target.closest ? e.target.closest('.ho-chk') : null;
        if (!b) return;
        var a = actions[+b.dataset.i];
        if (a == null) return;
        if (store.handoverDone.has(a)) store.handoverDone.delete(a);
        else store.handoverDone.add(a);
        store.emit('handover');   // 직접 바꿨으니 직접 알린다
      });

      var off = store.subscribe(function (what) {
        // 사건이 바뀌면(다른 화면에서 골라도) 그 사건 기준으로 다시 그린다.
        // 인력 배정(units)·단계(stage) 도 이 화면의 글에 그대로 나오므로 함께 듣는다
        if (what === 'incident' || what === 'handover' || what === 'units' || what === 'stage') render();
      });

      render();

      return {
        resize: function (t) { tile = t; render(); },
        destroy: function () { off(); }
      };
    }
  };

  // ══════════════════════════════════════════════════════════════
  //  사건 처리 상태 — 신고 접수부터 종료까지 8단계
  //  (아직 탭에는 없지만 Swift 쪽 코드가 남아 있어 함께 옮겨 둔다)
  // ══════════════════════════════════════════════════════════════
  PX.screens.progress = {
    mount: function (body, ctx) {
      var tile = ctx.tile;
      var root = PX.el(
        '<div class="pg-root">' +
          '<div class="pg-bar"></div>' +
          '<hr class="hair">' +
          '<div class="pg-scroll"><div class="pg-list"></div></div>' +
          '<hr class="hair">' +
          '<div class="pg-foot"></div>' +
        '</div>');
      body.appendChild(root);
      var bar = root.querySelector('.pg-bar');
      var scroll = root.querySelector('.pg-scroll');
      var list = root.querySelector('.pg-list');
      var foot = root.querySelector('.pg-foot');

      function render() {
        var inc = store.selectedIncident;
        var stages = PX.data.stages;
        var at = store.stageOf(inc.id);
        var last = stages.length - 1;
        var keep = scroll.scrollTop;

        var padV = (tile.isShort ? 7 : 10) + 'px';
        bar.style.padding = padV + ' ' + tile.inset + 'px';
        foot.style.padding = padV + ' ' + tile.inset + 'px';

        // ── 머리줄 ──
        bar.innerHTML =
          PX.dot(inc.priority) +
          '<span class="pg-id">' + esc(inc.id + ' ' + inc.type) + '</span>' +
          '<span class="pg-spacer"></span>' +
          '<span class="cap sec">' + esc(stages[at] + ' ' + (at + 1) + '/' + stages.length) + '</span>';

        // ── 단계 목록 ──
        var lineH = (tile.isShort ? 20 : 34) + 'px';
        var rowPadV = (tile.isShort ? 3 : 6) + 'px';
        var h = [];
        stages.forEach(function (name, idx) {
          h.push('<div class="pg-row" style="padding:' + rowPadV + ' ' + tile.inset + 'px">');
          h.push('<div class="pg-rail">');
          h.push('<span class="pg-node' + (idx <= at ? ' on' : '') + '"></span>');
          if (idx < last) {
            h.push('<span class="pg-line' + (idx < at ? ' past' : '') + '" style="height:' + lineH + '"></span>');
          }
          h.push('</div>');
          h.push('<div class="pg-txt">');
          h.push('<div class="pg-name' + (idx === at ? ' now' : '') + '">' + esc(name) + '</div>');
          // 창이 아주 낮으면 상태 글자는 떨어낸다 (Swift 의 !tile.isVeryShort 와 같다)
          if (!tile.isVeryShort) {
            h.push('<div class="cap sec">' + (idx < at ? '완료' : idx === at ? '진행 중' : '예정') + '</div>');
          }
          h.push('</div></div>');
        });
        list.innerHTML = h.join('');

        // ── 발치 단추 ──
        foot.innerHTML =
          '<button type="button" class="pg-btn" data-act="prev"' + (at <= 0 ? ' disabled' : '') + '>이전 단계</button>' +
          '<button type="button" class="pg-btn primary" data-act="next"' + (at >= last ? ' disabled' : '') + '>다음 단계</button>';

        scroll.scrollTop = keep;
      }

      foot.addEventListener('click', function (e) {
        var b = e.target.closest ? e.target.closest('.pg-btn') : null;
        if (!b || b.disabled) return;
        var id = store.selectedIncident.id;
        if (b.dataset.act === 'prev') store.prevStage(id);   // store 쪽이 알아서 emit('stage') 한다
        else store.nextStage(id);
      });

      var off = store.subscribe(function (what) {
        if (what === 'incident' || what === 'stage') render();
      });

      render();

      return {
        resize: function (t) { tile = t; render(); },
        destroy: function () { off(); }
      };
    }
  };

})(window.PX);

</script>
<script>
/* ===== shell.js ===== */
/* 콘솔 껍데기 — ContentView.swift 를 옮긴 것.
   상단 상태바 · 왼쪽 런처 · 떠 있는 창들 · 하단 작업표시줄.

   창 안의 화면은 **열 때 한 번만 만들고**, 자리가 바뀌어도 다시 만들지 않는다.
   지도와 3D 는 다시 만들면 타일과 28MB 스캔을 처음부터 다시 읽는다. */
(function (PX) {
  'use strict';

  const store = PX.store, wm = PX.wm;
  const deskEl = PX.$('#desk');
  const railEl = PX.$('#rail');
  const previewEl = PX.$('#drop-preview');

  const live = {};          // 탭 id → { win, bodyEl, inst, tile }
  let railW = +(localStorage.getItem('railWidth') || 190);
  let railDrag = null;

  // ── 상태바 ─────────────────────────────────────────
  function drawStatusBar() {
    const inc = store.selectedIncident;
    PX.$('#statusbar').className = 'glass';
    PX.$('#statusbar').innerHTML =
      `<div class="logo">PARALLAX</div>
       <div class="cap sec mono" id="sb-clock">${PX.now(true)}</div>
       <div class="sb-inc"><b>${PX.esc(inc.id)}</b><span class="cap">${PX.esc(inc.type)}</span></div>
       <div class="sb-fake" title="지도는 실제이고 사건·인력·장소는 모두 가상입니다">가상 데이터</div>
       <div class="sb-stats">
         <span class="sb-stat"><span class="sec">진행 중 사건</span><b>${store.activeIncidents.length}건</b></span>
         <span class="sb-stat"><span class="sec">투입 인원</span><b>${store.officers.filter(o => o.incidentID).length}명</b></span>
         <span class="sb-stat"><span class="sec">긴급 알림</span><b>${store.unseenAlertCount}건</b></span>
       </div>
       <div class="sb-icons">
         <button class="btn icon" data-act="dark" title="다크 모드">${PX.icon(store.darkMode ? 'sun' : 'moon')}</button>
         <button class="btn icon" data-act="sound" title="알림음">${PX.icon(store.soundOn ? 'sound' : 'mute')}</button>
         <button class="btn icon" title="단축키">${PX.icon('keyboard')}</button>
         <button class="btn icon" title="계정">${PX.icon('user')}</button>
       </div>`;
    PX.$('#statusbar').onclick = e => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      if (b.dataset.act === 'dark') {
        store.darkMode = !store.darkMode;
        document.documentElement.dataset.theme = store.darkMode ? 'dark' : 'light';
        store.emit('theme');
        drawStatusBar();
      } else if (b.dataset.act === 'sound') {
        store.soundOn = !store.soundOn;
        drawStatusBar();
      }
    };
  }
  setInterval(() => {
    const c = PX.$('#sb-clock');
    if (c) c.textContent = PX.now(true);
  }, 1000);

  // ── 왼쪽 런처 ───────────────────────────────────────
  function drawRail() {
    const compact = railW < 118;
    railEl.className = 'glass' + (compact ? ' compact' : '');
    railEl.style.width = railW + 'px';
    railEl.innerHTML = PX.TABS.map(t => {
      const open = wm.isOpen(t.id);
      const cls = 'rail-item' + (open ? (wm.focused === t.id ? ' open focus' : ' open') : '');
      return `<button class="${cls}" data-tab="${t.id}" title="${PX.esc(t.name)}">
                ${PX.icon(t.icon)}<span>${PX.esc(t.name)}</span></button>`;
    }).join('');
    railEl.onclick = e => {
      const b = e.target.closest('[data-tab]');
      if (b) wm.toggle(b.dataset.tab);
    };
  }

  // 앱 바와 작업 영역 사이 모서리 — 끌어서 너비 조절
  (function railGrabber() {
    const grab = PX.$('#railgrab');
    let start = 0, from = 0;
    grab.addEventListener('mousedown', e => {
      e.preventDefault();
      start = e.clientX; from = railW;
      railDrag = railW;
      document.body.classList.add('resizing');
      const move = ev => {
        const want = from + (ev.clientX - start);
        railW = Math.round(PX.clamp(want, 56, 260) / 4) * 4;   // 4px 단위로 끊는다
        drawRail();
        sizeAll();
      };
      const up = () => {
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
        document.body.classList.remove('resizing');
        // 애매한 폭에서는 가까운 쪽으로 붙인다 — 아이콘만 보이거나, 이름까지 보이거나
        if (railW < 100) railW = 56;
        else if (railW < 140) railW = 150;
        localStorage.setItem('railWidth', railW);   // 저장은 손을 놓을 때 한 번만
        railDrag = null;
        drawRail();
        sizeAll();
      };
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
    });
  })();

  /* ── 창 배치 독 ─────────────────────────────────────
     하단 바를 없애고 세 단추만 남겼다. 작업 영역 아래쪽에 손이 왔을 때만 떠오른다 —
     늘 떠 있으면 창 아래쪽(지도의 재생 막대, 3D 상태 칸)을 가린다. */
  const dockEl = PX.$('#dock');
  dockEl.innerHTML =
    `<button class="dock-btn" data-tile="2">${PX.icon('split2')}2분할</button>
     <button class="dock-btn" data-tile="4">${PX.icon('split4')}4분할</button>
     <button class="dock-btn" data-reset="1">${PX.icon('reset')}위치 초기화</button>`;
  dockEl.onclick = e => {
    const tile = e.target.closest('[data-tile]');
    if (tile) { wm.tile(+tile.dataset.tile); return; }
    if (e.target.closest('[data-reset]')) wm.resetLayout();
  };

  /* 아래쪽 띠에 손이 들어오면 띄운다.
     창 안에 iframe(공간 3D)이 있으면 그 위에서는 바깥이 마우스 이동을 못 받는다.
     그래서 작업 영역 맨 아래에 **창 사이 틈만큼 얇은 띠**를 하나 깔아 그때도 잡는다. */
  const DOCK_ZONE = 70;
  let dockTimer = null;
  const showDock = () => { clearTimeout(dockTimer); dockEl.classList.add('on'); };
  const hideDock = ms => {
    clearTimeout(dockTimer);
    dockTimer = setTimeout(() => dockEl.classList.remove('on'), ms || 0);
  };
  const zoneEl = PX.el('<div id="dock-zone"></div>');
  deskEl.appendChild(zoneEl);
  zoneEl.addEventListener('mouseenter', showDock);
  zoneEl.addEventListener('mouseleave', () => hideDock(350));
  dockEl.addEventListener('mouseenter', showDock);
  dockEl.addEventListener('mouseleave', () => hideDock(350));
  deskEl.addEventListener('mousemove', e => {
    const r = deskEl.getBoundingClientRect();
    if ((r.bottom - e.clientY) <= DOCK_ZONE) showDock(); else hideDock(250);
  });
  deskEl.addEventListener('mouseleave', () => hideDock(200));

  // ── 창 ────────────────────────────────────────────
  function makeWindow(w) {
    const tab = PX.tabOf(w.id);
    const el = PX.el(
      `<section class="win glass" data-win="${w.id}">
         <div class="win-body"></div>
         <header class="win-bar">
           <span class="win-title">
             ${PX.icon(tab.icon)}<b>${PX.esc(tab.name)}</b>
           </span>
           <span class="win-btns">
             <button data-max="1" title="최대화">${PX.icon('expand')}</button>
             <button data-close="1" title="닫기">${PX.icon('close')}</button>
           </span>
         </header>
       </section>`);
    deskEl.appendChild(el);

    el.addEventListener('mousedown', () => wm.focus(w.id), true);

    // 창 위쪽 띠에 손이 들어왔을 때만 이름표와 단추를 띄운다
    const TOP_ZONE = 46;
    el.addEventListener('mousemove', e => {
      const r = el.getBoundingClientRect();
      el.classList.toggle('chrome', (e.clientY - r.top) <= TOP_ZONE);
    });
    el.addEventListener('mouseleave', () => el.classList.remove('chrome'));
    el.querySelector('[data-max]').onclick = e => { e.stopPropagation(); wm.toggleMax(w.id); };
    el.querySelector('[data-close]').onclick = e => { e.stopPropagation(); wm.close(w.id); };
    dragTitleBar(el, w.id);

    const body = el.querySelector('.win-body');
    const entry = { el: el, bodyEl: body, inst: null, tile: null };
    live[w.id] = entry;

    const screen = PX.screens[w.id];
    if (screen) {
      try {
        entry.inst = screen.mount(body, { store: store, wm: wm, tile: PX.tile(400, 300) });
      } catch (err) {
        console.error('화면을 못 열었습니다:', w.id, err);
        body.innerHTML = `<div style="padding:20px" class="sec cap">${PX.esc(w.id)} 화면을 여는 중 오류가 났습니다.</div>`;
      }
    } else {
      body.innerHTML = `<div style="padding:20px" class="sec cap">${PX.esc(tab.name)}은(는) 아직 옮기는 중입니다.</div>`;
    }
    return entry;
  }

  /* 제목줄을 끌어 자리를 옮긴다.
     판정은 **손끝(포인터)** 으로 한다 — 창 중심으로 재면 큰 창일수록 한참 끌어야 반응해 둔하다. */
  function dragTitleBar(el, id) {
    const bar = el.querySelector('.win-title');
    bar.addEventListener('mousedown', e => {
      e.preventDefault();
      const startX = e.clientX, startY = e.clientY;
      let started = false;
      const move = ev => {
        const dx = ev.clientX - startX, dy = ev.clientY - startY;
        if (!started && Math.hypot(dx, dy) < 1.5) return;
        if (!started) {
          started = true;
          wm.beginDrag(id);
          el.classList.add('dragging');
          el.classList.remove('settling');
        }
        el.style.transform = `translate(${dx}px, ${dy}px)`;   // 창은 손을 그대로 따라온다
        const box = deskEl.getBoundingClientRect();
        wm.updateDrag(id, { x: (ev.clientX - box.left) / box.width, y: (ev.clientY - box.top) / box.height });
      };
      const up = () => {
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
        if (!started) return;
        el.classList.remove('dragging');
        el.style.transform = '';
        el.classList.add('settling');
        wm.endDrag(id);
        setTimeout(() => el.classList.remove('settling'), 260);
      };
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
    });
  }

  /** 창 목록을 지금 상태에 맞춘다 (열고 닫을 때만 만들고 없앤다) */
  function syncWindows() {
    Object.keys(live).forEach(id => {
      const w = wm.win(id);
      if (!w) {                       // 닫혔다
        const e = live[id];
        if (e.inst && e.inst.destroy) { try { e.inst.destroy(); } catch (err) { console.error(err); } }
        e.el.remove();
        delete live[id];
      }
    });
    wm.windows.forEach(w => { if (!live[w.id]) makeWindow(w); });
    sizeAll();
  }

  /** 창 자리와 크기를 화면에 반영한다 */
  function sizeAll() {
    const box = deskEl.getBoundingClientRect();
    wm.noteDeskSize(box.width, box.height);

    wm.windows.forEach(w => {
      const e = live[w.id];
      if (!e) return;
      if (w.minimized) { e.el.hidden = true; return; }
      e.el.hidden = false;
      const f = w.maximized ? { x: 0, y: 0, w: 1, h: 1 } : w.frac;
      // Swift 판처럼 칸 사이에 8pt 를 비워 창이 서로 붙어 보이지 않게 한다
      const x = f.x * box.width, y = f.y * box.height;
      const cw = Math.max(f.w * box.width - 8, 140), ch = Math.max(f.h * box.height - 8, 120);
      e.el.style.left = (x + 4) + 'px';
      e.el.style.top = (y + 4) + 'px';
      e.el.style.width = cw + 'px';
      e.el.style.height = ch + 'px';
      e.el.style.zIndex = w.z;
      e.el.classList.toggle('focus', wm.focused === w.id);
      e.el.classList.toggle('tiny', cw < 260);
      // 이름이 빠지고 아이콘만 남을 때만 풍선말을 붙인다 (보이는 글자를 또 띄우지 않게)
      const titleEl = e.el.querySelector('.win-title');
      if (cw < 260) titleEl.setAttribute('title', PX.tabOf(w.id).name);
      else titleEl.removeAttribute('title');
      e.el.classList.toggle('short', ch < 200);

      // 화면 안쪽에 지금 크기를 알려 준다 (TileMeasured).
      // 제목줄은 내용 위에 떠 있을 뿐 칸을 차지하지 않으므로 높이를 빼지 않는다
      const t = PX.tile(cw, ch);
      const was = e.tile;
      e.tile = t;
      if (e.inst && e.inst.resize && (!was || was.width !== t.width || was.height !== t.height)) {
        try { e.inst.resize(t); } catch (err) { console.error(err); }
      }
    });
    drawDividers();
  }

  // ── 창 사이 경계 ───────────────────────────────────
  // 끄는 도중에는 손잡이를 다시 만들지 않는다 — 잡고 있던 것이 사라지면 표시가 끊긴다
  let dividerDrag = false;
  function drawDividers() {
    if (dividerDrag) return;
    PX.$$('.divider', deskEl).forEach(d => d.remove());
    const box = deskEl.getBoundingClientRect();
    wm.dividers.forEach(d => {
      const v = d.axis === 'v';
      const el = PX.el(`<div class="divider ${v ? 'v' : 'h'}"></div>`);
      const len = (d.end - d.start) * (v ? box.height : box.width);
      if (v) {
        el.style.left = (d.position * box.width - 6) + 'px';
        el.style.top = (d.start * box.height + 6) + 'px';
        el.style.height = Math.max(len - 12, 24) + 'px';
      } else {
        el.style.top = (d.position * box.height - 6) + 'px';
        el.style.left = (d.start * box.width + 6) + 'px';
        el.style.width = Math.max(len - 12, 24) + 'px';
      }
      el.addEventListener('mousedown', e => {
        e.preventDefault();
        el.classList.add('on');
        dividerDrag = true;
        document.body.classList.add('resizing');
        const move = ev => {
          const b = deskEl.getBoundingClientRect();
          wm.moveDivider(d, v ? (ev.clientX - b.left) / b.width : (ev.clientY - b.top) / b.height);
          sizeAll();
        };
        const up = () => {
          document.removeEventListener('mousemove', move);
          document.removeEventListener('mouseup', up);
          document.body.classList.remove('resizing');
          el.classList.remove('on');
          dividerDrag = false;
          drawDividers();
        };
        document.addEventListener('mousemove', move);
        document.addEventListener('mouseup', up);
      });
      deskEl.appendChild(el);
    });
  }

  // ── 놓을 자리 미리보기 ─────────────────────────────
  function drawPreview() {
    const zone = wm.drag.zone;
    if (!zone) { previewEl.hidden = true; return; }
    const box = deskEl.getBoundingClientRect();
    const r = zone.rect;
    previewEl.hidden = false;
    previewEl.style.left = (r.x * box.width + 4) + 'px';
    previewEl.style.top = (r.y * box.height + 4) + 'px';
    previewEl.style.width = Math.max(r.w * box.width - 8, 40) + 'px';
    previewEl.style.height = Math.max(r.h * box.height - 8, 40) + 'px';
  }

  // ── 붙이기 ────────────────────────────────────────
  wm.subscribe(what => {
    if (what === 'drag') { drawPreview(); return; }
    if (what === 'frames') { return; }          // 경계 끌기는 sizeAll 이 직접 부른다
    drawRail();
    syncWindows();
  });
  store.subscribe(what => {
    if (what === 'incident' || what === 'messages' || what === 'alerts') drawStatusBar();
  });

  /* 단축키 — 맥 판의 「창 배치」·「앱」 메뉴와 같게 둔다.
     브라우저가 이미 쓰는 것(⌘W 로 탭 닫기 등)은 막을 수 없으므로 preventDefault 로 가로챈다. */
  window.addEventListener('keydown', e => {
    const meta = e.metaKey || e.ctrlKey;
    if (!meta) return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;   // 글을 쓰는 중에는 건드리지 않는다

    // ⌘1~5 — 앱 열기
    if (!e.altKey && /^[1-5]$/.test(e.key) && !e.ctrlKey) {
      e.preventDefault();
      wm.open(PX.TABS[+e.key - 1].id);
      return;
    }
    // ⌃⌘2 / ⌃⌘4 / ⌃⌘R — 2분할 · 4분할 · 위치 초기화
    if (e.ctrlKey && e.metaKey) {
      if (e.key === '2') { e.preventDefault(); wm.tile(2); return; }
      if (e.key === '4') { e.preventDefault(); wm.tile(4); return; }
      if (e.key.toLowerCase() === 'r') { e.preventDefault(); wm.resetLayout(); return; }
    }
    // ⌘` / ⌘⇧` — 다음 창 · 이전 창
    if (e.key === '`') { e.preventDefault(); wm.cycleFocus(e.shiftKey ? -1 : 1); return; }
    // ⌘W — 창 닫기
    if (e.key.toLowerCase() === 'w') { e.preventDefault(); wm.close(wm.focused); return; }
  });

  // ⌃⌥←/→/↑ — 포커스된 창을 절반·전체로 (맥 판의 snapFocused)
  window.addEventListener('keydown', e => {
    if (!(e.ctrlKey && e.altKey)) return;
    const w = wm.win(wm.focused);
    if (!w) return;
    const spot = e.key === 'ArrowLeft' ? { x: 0, y: 0, w: 0.5, h: 1 }
      : e.key === 'ArrowRight' ? { x: 0.5, y: 0, w: 0.5, h: 1 }
      : e.key === 'ArrowUp' ? { x: 0, y: 0, w: 1, h: 1 }
      : e.key === 'ArrowDown' ? { x: 0, y: 0.5, w: 1, h: 0.5 } : null;
    if (!spot) return;
    e.preventDefault();
    w.frac = spot;
    w.maximized = false;
    sizeAll();
  });

  window.addEventListener('resize', sizeAll);

  document.documentElement.dataset.theme = store.darkMode ? 'dark' : 'light';
  drawStatusBar();
  drawRail();
  syncWindows();
})(window.PX);

</script>
</body>
</html>
