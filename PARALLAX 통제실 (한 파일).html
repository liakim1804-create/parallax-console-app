  PX.$$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  PX.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /** 아이콘 한 개. SF Symbols 대신 index.html 의 스프라이트를 쓴다 */
  PX.icon = (name, cls) => `<svg class="ic ${cls || ''}" aria-hidden="true"><use href="#ic-${name}"/></svg>`;

  PX.el = (html) => {
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  };

  PX.clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  /** "20:41" → 자정부터 분 */
  PX.hm = s => {
    const p = String(s || '').split(':');
    return p.length === 2 ? (+p[0]) * 60 + (+p[1]) : 0;
  };
  /** 분 → "20:41" */
  PX.clockText = m => {
    const t = Math.max(0, Math.round(m));
    return String(Math.floor(t / 60) % 24).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
  };
  PX.now = (withSec) => {
    const d = new Date(), p = n => String(n).padStart(2, '0');
    return p(d.getHours()) + ':' + p(d.getMinutes()) + (withSec ? ':' + p(d.getSeconds()) : '');
  };

  /** 중요도 → 색 이름 (Theme.color) */
  PX.prio = p => (p === '긴급' ? 'urgent' : p === '주의' ? 'caution' : 'normal');
  PX.dot = (p, size) => `<span class="dot ${PX.prio(p)}"${size ? ` style="width:${size}px;height:${size}px"` : ''}></span>`;

  // ── 창 크기에 따른 규칙 (TileMetrics.swift) ─────────────
  // 각 화면이 이 값을 보고 내용을 줄이거나 바꾼다.
  PX.tile = (w, h) => ({
    width: w, height: h,
    isNarrow: w < 520,        // 보조 정보 줄이기
    isVeryNarrow: w < 360,    // 한 줄에 한 가지만
    isTiny: w < 300,          // 제목·라벨까지 떨어내고 아이콘만
    isShort: h < 360,         // 목록·여백 줄이기
    isVeryShort: h < 240,     // 핵심만 남기기
    isTinyHeight: h < 190,    // 머리글도 접는다
    get inset() { return this.isTiny ? 8 : (this.isVeryNarrow ? 10 : 14); },
    get blockGap() { return this.isShort ? 12 : 20; }
  });

  // ── 콘솔 전체가 함께 보는 상태 (ConsoleStore) ───────────
  const D = PX.data;
  const store = {
    incidents: D.incidents.slice(),
    officers: D.officers.map(o => Object.assign({}, o)),
    vehicles: D.vehicles.map(v => Object.assign({}, v)),
    cameras: D.cameras.slice(),
    caseGroups: D.caseGroups.slice(),
    messages: D.messages.map(m => Object.assign({ id: 'm' + Math.random().toString(36).slice(2, 9) }, m)),
    alerts: D.alerts.map(a => Object.assign({ id: 'a' + Math.random().toString(36).slice(2, 9) }, a)),

    selectedIncidentID: (D.initial && D.initial.selectedIncidentID) || 'A-102',
    darkMode: !!(D.initial && D.initial.darkMode),
    soundOn: D.initial ? D.initial.soundOn !== false : true,

    drafts: {},
    stageIndex: Object.assign({}, D.stageIndex || {}),
    txItems: new Set(),
    txTargets: new Set(),
    txNote: '',
    txSent: [],
    handoverDone: new Set(),

    // 구독 — SwiftUI 의 @Published 자리
    _subs: new Set(),
    subscribe(fn) { this._subs.add(fn); return () => this._subs.delete(fn); },
    emit(what) { this._subs.forEach(fn => { try { fn(what); } catch (e) { console.error(e); } }); },

    get selectedIncident() {
      return this.incidents.find(i => i.id === this.selectedIncidentID) || this.incidents[0];
    },
    get activeIncidents() { return this.incidents.filter(i => i.status !== '종료'); },
    get unseenAlertCount() { return this.alerts.filter(a => !a.seen && !a.isMine).length; },

    officersOf(inc) { return this.officers.filter(o => o.incidentID === inc); },
    vehiclesOf(inc) { return this.vehicles.filter(v => v.incidentID === inc); },
    camerasOf(inc) { return this.cameras.filter(c => c.incidentID === inc); },
    caseGroupOf(inc) { return this.caseGroups.find(g => g.reportIDs.indexOf(inc) >= 0); },

    select(id) {
      if (this.selectedIncidentID === id) return;
      this.selectedIncidentID = id;
      this.emit('incident');
    },

    // ── 메시지 ──
    thread(target) {
      return this.messages.filter(m => target.names.indexOf(m.to) >= 0 || target.names.indexOf(m.from) >= 0);
    },

    send(target, text, kind) {
      const body = String(text || '').trim();
      if (!body) return;
      const msg = {
        id: 'm' + Math.random().toString(36).slice(2, 9),
        incidentID: this.selectedIncidentID, from: '지휘통제실', to: target.sendName,
        kind: kind || '일반', text: body, time: PX.now(), isRead: false, isMine: true, isPinned: false
      };
      this.messages.push(msg);
      this.drafts[target.id] = '';
      if (kind && kind !== '일반') {
        this.alerts.unshift({
          id: 'a' + Math.random().toString(36).slice(2, 9),
          level: kind === '긴급' ? '긴급' : '주의',
          title: kind === '긴급' ? '긴급 지시 발신' : '중요 지시 발신',
          detail: target.label + ' 대상: ' + body,
          time: PX.now(true), incidentID: this.selectedIncidentID, seen: true, isMine: true
        });
      }
      this.emit('messages');
      // 잠시 뒤 상대가 확인하고 답신한다 (가상 동작)
      setTimeout(() => { msg.isRead = true; this.emit('messages'); }, 2200);
      setTimeout(() => {
        const replies = ['수신했습니다.', '확인했습니다. 조치하겠습니다.', '내용 확인. 진행 중입니다.'];
        const from = target.isGroup ? (target.members[0] || '현장 경찰') : target.sendName;
        this.messages.push({
          id: 'm' + Math.random().toString(36).slice(2, 9),
          incidentID: this.selectedIncidentID, from: from,
          to: target.isGroup ? target.sendName : '지휘통제실',
          kind: '일반', text: replies[Math.floor(Math.random() * replies.length)],
          time: PX.now(), isRead: false, isMine: false, isPinned: false
        });
        this.emit('messages');
      }, 4200);
    },

    markRead(id) {
      const m = this.messages.find(x => x.id === id);
      if (m) { m.isRead = true; this.emit('messages'); }
    },
    togglePin(id) {
      const m = this.messages.find(x => x.id === id);
      if (m) { m.isPinned = !m.isPinned; this.emit('messages'); }
    },
    markAllAlertsSeen() { this.alerts.forEach(a => { a.seen = true; }); this.emit('alerts'); },

    // ── 인력·차량 배정 ──
    assignOfficer(id, inc) {
      const o = this.officers.find(x => x.id === id);
      if (o) { o.incidentID = inc; this.emit('units'); }
    },
    unassignOfficer(id) {
      const o = this.officers.find(x => x.id === id);
      if (o) { o.incidentID = null; this.emit('units'); }
    },
    assignVehicle(id, inc) {
      const v = this.vehicles.find(x => x.id === id);
      if (v) { v.incidentID = inc; this.emit('units'); }
    },
    unassignVehicle(id) {
      const v = this.vehicles.find(x => x.id === id);
      if (v) { v.incidentID = null; this.emit('units'); }
    },

    // ── 사건 처리 단계 ──
    stageOf(inc) { return this.stageIndex[inc] || 0; },
    nextStage(inc) {
      const n = this.stageOf(inc);
      if (n < PX.data.stages.length - 1) { this.stageIndex[inc] = n + 1; this.emit('stage'); }
    },
    prevStage(inc) {
      const n = this.stageOf(inc);
      if (n > 0) { this.stageIndex[inc] = n - 1; this.emit('stage'); }
    },

    // ── 현장 정보 전송 ──
    sendTransmission() {
      if (!this.txItems.size || !this.txTargets.size) return;
      const items = Array.from(this.txItems).sort();
      const targets = Array.from(this.txTargets).sort();
      const rec = { items: items, targets: targets, note: this.txNote, time: PX.now() };
      this.txSent.unshift(rec);
      targets.forEach(t => {
        this.messages.push({
          id: 'm' + Math.random().toString(36).slice(2, 9),
          incidentID: this.selectedIncidentID, from: '지휘통제실', to: t, kind: '중요',
          text: '[현장 전송] ' + items.join(' · ') + (rec.note ? ' / ' + rec.note : ''),
          time: rec.time, isRead: false, isMine: true, isPinned: false
        });
      });
      this.alerts.unshift({
        id: 'a' + Math.random().toString(36).slice(2, 9),
        level: '주의', title: '현장 정보 전송',
        detail: items.join(' · ') + ' 을(를) 전달했습니다.',
        time: PX.now(true), incidentID: this.selectedIncidentID, seen: true, isMine: true
      });
      this.txItems.clear(); this.txTargets.clear(); this.txNote = '';
      this.emit('transmit');
    },

    // ── 받는 대상 목록 (현장팀 / 후속팀 / 상황실 내부) ──
    get chatTargets() {
      const field = this.officersOf(this.selectedIncidentID);
      const backup = this.officers.filter(o => !o.incidentID);
      const team = (name, units, legacy) => {
        if (!units.length) return [];
        const groupName = name + ' 전체';
        return [{
          id: 'g:' + name, label: groupName + ' · ' + units.length + '개 팀', sendName: groupName,
          isGroup: true, names: [groupName].concat(legacy), members: units.map(u => u.call)
        }].concat(units.map(o => ({
          id: 'u:' + o.call, label: o.call + ' ' + o.name, sendName: o.call,
          isGroup: false, names: [o.call], members: [o.call]
        })));
      };
      return [
        { title: '현장팀', targets: team('현장팀', field, ['현장 경찰', '전체 현장 인력']) },
        { title: '후속팀', targets: team('후속팀', backup, ['후속 인력']) },
        { title: '상황실 내부', targets: [] }
      ];
    }
  };

  PX.store = store;

  // 화면 등록소. 각 screen-*.js 가 여기에 자기를 넣는다.
  // { mount(bodyEl, ctx) → 인스턴스, 인스턴스는 resize(tile)/destroy() 를 가질 수 있다 }
  PX.screens = {};
})(window.PX);

</script>
<script>
/* ===== tiling.js ===== */
/* 창 관리자 — WindowSystem.swift 를 그대로 옮긴 것.
   자리표(spots), 빈 자리 찾기, 끌어서 붙이기, 경계 끌기, 다시 채우기까지 규칙이 같다.
   좌표는 전부 화면 대비 비율(0~1)이다. */
window.PX = window.PX || {};

(function (PX) {
  'use strict';

  // 탭 (ConsoleTab)
  const TABS = [
    { id: 'overview', name: '전체 상황', short: '전체 상황', icon: 'grid' },
    { id: 'map', name: '작전 지도', short: '작전 지도', icon: 'map' },
    { id: 'space', name: '공간 3D', short: '3D', icon: 'cube' },
    { id: 'transmit', name: '현장 정보 전송', short: '전송', icon: 'message' },
    { id: 'handover', name: '기록·회의록', short: '기록', icon: 'doc' }
  ];
  PX.TABS = TABS;
  PX.tabOf = id => TABS.find(t => t.id === id);

  // ── 사각형 도구 (CGRect 대신) ──
  const R = (x, y, w, h) => ({ x: x, y: y, w: w, h: h });
  const maxX = r => r.x + r.w, maxY = r => r.y + r.h;
  const midX = r => r.x + r.w / 2, midY = r => r.y + r.h / 2;
  const inset = (r, dx, dy) => R(r.x + dx, r.y + dy, Math.max(0, r.w - dx * 2), Math.max(0, r.h - dy * 2));
  const contains = (r, p) => p.x >= r.x && p.x <= maxX(r) && p.y >= r.y && p.y <= maxY(r);
  function overlapArea(a, b) {
    const w = Math.min(maxX(a), maxX(b)) - Math.max(a.x, b.x);
    const h = Math.min(maxY(a), maxY(b)) - Math.max(a.y, b.y);
    return (w > 0 && h > 0) ? w * h : 0;
  }
  const same = (a, b) => a && b && a.x === b.x && a.y === b.y && a.w === b.w && a.h === b.h;
  PX.rect = { R: R, maxX: maxX, maxY: maxY, midX: midX, midY: midY, same: same };

  const MIN_PANE_W = 230;   // 칸 하나가 제 구실을 하는 가장 작은 크기 (px)
  const MIN_PANE_H = 170;
  const MIN_PANE = 0.14;    // 비율로 지키는 최소
  const EDGE_EPS = 0.012;
  const MIN_SIDE = 0.18;

  const wm = {
    windows: [],
    focused: 'map',
    resizing: false,
    deskSize: { w: 1200, h: 800 },
    zTop: 20,
    drag: { dragging: null, zone: null },
    _zoneCache: [],
    _subs: new Set(),

    subscribe(fn) { this._subs.add(fn); return () => this._subs.delete(fn); },
    emit(what) { this._subs.forEach(fn => { try { fn(what); } catch (e) { console.error(e); } }); },

    noteDeskSize(w, h) {
      if (w > 1 && h > 1) { this.deskSize = { w: w, h: h }; }
    },

    /** 지금 화면에서 최소 크기가 차지하는 비율 */
    get minPaneX() { return Math.min(0.45, Math.max(0.12, MIN_PANE_W / this.deskSize.w)); },
    get minPaneY() { return Math.min(0.45, Math.max(0.12, MIN_PANE_H / this.deskSize.h)); },

    get visible() { return this.windows.filter(w => !w.minimized).sort((a, b) => a.z - b.z); },
    get openTabs() { return this.windows.map(w => w.id); },
    isOpen(id) { return this.windows.some(w => w.id === id); },
    win(id) { return this.windows.find(w => w.id === id); },

    /* 한 가지 규칙으로 만든 자리표. 탭 수보다 많이 쪼갤 일은 없다.
         왼쪽 세로 칸(전체 상황 자리) + 오른쪽을 위·아래 두 줄로
         아래 줄을 세 칸까지 채우고, 그다음 위 줄을 세 칸까지 채운다 */
    spots(count) {
      const n = Math.min(Math.max(count, 0), TABS.length);
      const left = 0.25, topH = 0.62, rest = 1 - left;
      const row = (cells, y, h) => {
        if (cells <= 0) return [];
        const w = rest / cells;
        const out = [];
        for (let i = 0; i < cells; i++) out.push(R(left + i * w, y, w, h));
        return out;
      };
      if (n === 0) return [];
      if (n === 1) return [R(0, 0, 1, 1)];
      if (n === 2) return [R(0, 0, 0.3, 1), R(0.3, 0, 0.7, 1)];
      const others = n - 1;
      const bottom = Math.min(3, others - 1);
      const top = others - bottom;
      return [R(0, 0, left, 1)].concat(row(top, 0, topH), row(bottom, topH, 1 - topH));
    },

    defaultLayout() {
      const spots = this.spots(4);
      return ['overview', 'map', 'space', 'transmit'].map((tab, i) => ({
        id: tab, frac: spots[i], z: 11 + i, minimized: false, maximized: false
      }));
    },

    /* 지금 화면이 감당할 수 있는 칸 수.
       아이패드 Split View 가 화면 크기에 따라 두세 개까지만 붙이는 것과 같은 생각이다 */
    get paneCapacity() {
      for (let n = TABS.length; n >= 1; n--) {
        const cells = this.spots(n);
        const narrowest = Math.min.apply(null, cells.map(c => c.w));
        const shortest = Math.min.apply(null, cells.map(c => c.h));
        if (narrowest * this.deskSize.w >= MIN_PANE_W && shortest * this.deskSize.h >= MIN_PANE_H) return n;
      }
      return 1;
    },

    focus(id) {
      const w = this.win(id);
      if (!w) return;
      this.zTop += 1;
      w.z = this.zTop;
      w.minimized = false;
      this.focused = id;
      this.emit('focus');
    },

    toggle(id) { this.isOpen(id) ? this.close(id) : this.open(id); },

    open(id) {
      if (this.isOpen(id)) { this.focus(id); return; }
      // 자리가 모자라면 가장 오래 안 쓴 칸을 작업표시줄로 내린다 (닫지 않는다)
      let guard = 0;
      while (this.windows.filter(w => !w.minimized).length >= this.paneCapacity && guard++ < 10) {
        const oldest = this.windows.filter(w => !w.minimized).sort((a, b) => a.z - b.z)[0];
        if (!oldest) break;
        oldest.minimized = true;
      }
      this.zTop += 1;
      const spot = this._emptySpot(id);
      if (spot) {
        this.windows.push({ id: id, frac: spot, z: this.zTop, minimized: false, maximized: false });
        this._tidyEdges();       // 격자로 찾은 자리라 이웃과 모서리를 맞춰 준다
        this._fillGapsIfNeeded();
      } else {
        this.windows.push({ id: id, frac: R(0.3, 0.25, 0.4, 0.5), z: this.zTop, minimized: false, maximized: false });
        this.reflow();
      }
      this.focused = id;
      this.emit('layout');
    },

    close(id) {
      this.windows = this.windows.filter(w => w.id !== id);
      if (this.focused === id) {
        const v = this.visible;
        this.focused = v.length ? v[v.length - 1].id : 'map';
      }
      this.reflow();
      this.emit('layout');
    },

    toggleMax(id) {
      const w = this.win(id);
      if (!w) return;
      w.maximized = !w.maximized;
      this.focus(id);
      this.emit('layout');
    },

    /* 새 창이 들어갈 자리.
       1) 기본 배치에서 이 앱의 자리가 비어 있으면 그 자리
       2) 아니면 남아 있는 빈 공간 중 가장 넓은 사각형
       3) 빈 곳이 없으면 null — 부르는 쪽이 기본 구성으로 다시 채운다 */
    _emptySpot(id) {
      const taken = this.windows.filter(w => !w.minimized).map(w => w.maximized ? R(0, 0, 1, 1) : w.frac);
      const home = this.defaultLayout().find(w => w.id === id);
      if (home && this._coveredRatio(home.frac, taken) < 0.12) return home.frac;
      const free = this._largestFreeRect(taken);
      if (free && free.w >= 0.2 && free.h >= 0.2) return free;
      return null;
    },

    /** 어떤 자리가 기존 창들에 얼마나 덮여 있는지 (0 = 완전히 빔) */
    _coveredRatio(rect, taken) {
      const area = rect.w * rect.h;
      if (area <= 0) return 1;
      let covered = 0;
      taken.forEach(t => { covered += overlapArea(rect, t); });
      return Math.min(covered / area, 1);
    },

    /** 화면을 격자로 나눠 비어 있는 가장 큰 사각형을 찾는다 */
    _largestFreeRect(taken, grid) {
      const n = grid || 48;
      const free = [];
      for (let r = 0; r < n; r++) free.push(new Array(n).fill(true));
      taken.forEach(t => {
        const c0 = Math.max(0, Math.floor(t.x * n));
        const c1 = Math.min(n - 1, Math.ceil(maxX(t) * n) - 1);
        const r0 = Math.max(0, Math.floor(t.y * n));
        const r1 = Math.min(n - 1, Math.ceil(maxY(t) * n) - 1);
        if (c0 > c1 || r0 > r1) return;
        for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) free[r][c] = false;
      });

      const height = new Array(n).fill(0);
      let bestArea = 0, best = null;
      for (let row = 0; row < n; row++) {
        for (let col = 0; col < n; col++) height[col] = free[row][col] ? height[col] + 1 : 0;
        const stack = [];
        let col = 0;
        while (col <= n) {
          const h = col === n ? 0 : height[col];
          if (!stack.length || h >= height[stack[stack.length - 1]]) { stack.push(col); col++; }
          else {
            const top = stack.pop();
            const left = stack.length ? stack[stack.length - 1] + 1 : 0;
            const width = col - left;
            const area = height[top] * width;
            if (area > bestArea) {
              bestArea = area;
              best = { top: row - height[top] + 1, left: left, bottom: row, right: left + width - 1 };
            }
          }
        }
      }
      if (!bestArea || !best) return null;
      const cell = 1 / n;
      return R(best.left * cell, best.top * cell,
               (best.right - best.left + 1) * cell, (best.bottom - best.top + 1) * cell);
    },

    /* 열린 창을 자리표에 다시 앉힌다 — 빈 공간이 남지 않는다.
       되도록 지금 있던 자리와 가까운 칸으로 보내 덜 움직이게 한다. */
    reflow() {
      let rest = this.windows.filter(w => !w.minimized);
      if (!rest.length) return;
      let spots = this.spots(rest.length);
      if (!spots.length) return;

      // 전체 상황은 기본 구성대로 왼쪽 칸에 둔다
      if (rest.length >= 3) {
        const ov = rest.find(w => w.id === 'overview');
        if (ov) { ov.frac = spots.shift(); rest = rest.filter(w => w !== ov); }
      }
      const gap = (a, b) => Math.hypot(midX(a) - midX(b), midY(a) - midY(b));
      spots.forEach(spot => {
        if (!rest.length) return;
        let best = rest[0];
        rest.forEach(w => { if (gap(w.frac, spot) < gap(best.frac, spot)) best = w; });
        best.frac = spot;
        rest = rest.filter(w => w !== best);
      });
      this._clampAll();
    },

    /* 놓고 난 자리에 구멍이 남았으면 기본 규칙대로 전부 다시 채운다.
       자리를 맞바꾸거나 반으로 나눠 빈틈이 없을 때는 손대지 않는다 */
    _fillGapsIfNeeded() {
      const taken = this.windows.filter(w => !w.minimized).map(w => w.maximized ? R(0, 0, 1, 1) : w.frac);
      const hole = this._largestFreeRect(taken);
      if (!hole) return;
      if (hole.w * hole.h > 0.01) this.reflow();   // 화면의 1% 를 넘는 구멍만 손본다
    },

    /* 칸이 화면 밖으로 조금이라도 나가면 그 부분은 잘려 보이지 않는다 —
       어떤 계산을 거쳤든 마지막에 화면 안으로 되돌린다 */
    _clampAll() {
      const mx = this.minPaneX, my = this.minPaneY;
      this.windows.forEach(w => {
        if (w.minimized) return;
        const f = w.frac;
        f.w = Math.min(Math.max(f.w, mx), 1);
        f.h = Math.min(Math.max(f.h, my), 1);
        f.x = Math.min(Math.max(0, f.x), 1 - f.w);
        f.y = Math.min(Math.max(0, f.y), 1 - f.h);
      });
    },

    /* 모서리 맞추기.
       빈 자리를 격자로 찾다 보면 이웃 창과 몇 픽셀씩 어긋나 창 사이 여백이 들쭉날쭉해진다.
       가까이 있는 모서리들을 한 값으로 모아 **창 사이 여백을 늘 같게** 만든다. */
    _tidyEdges() {
      const open = this.windows.filter(w => !w.minimized && !w.maximized);
      if (open.length <= 1) return;
      const xs = [], ys = [];
      open.forEach(w => { xs.push(w.frac.x, maxX(w.frac)); ys.push(w.frac.y, maxY(w.frac)); });
      const snapX = cluster(xs), snapY = cluster(ys);
      open.forEach(w => {
        const f = w.frac;
        const x0 = snapTo(f.x, snapX), x1 = snapTo(maxX(f), snapX);
        const y0 = snapTo(f.y, snapY), y1 = snapTo(maxY(f), snapY);
        if (x1 - x0 < MIN_PANE || y1 - y0 < MIN_PANE) return;
        w.frac = R(x0, y0, x1 - x0, y1 - y0);
      });
      this._clampAll();
    },

    /** 혹시 남은 겹침을 정리한다: 빈 자리로 옮기고, 그마저 없으면 작업표시줄로 내린다 */
    _resolveOverlaps(keep) {
      for (let pass = 0; pass < 3; pass++) {
        const clash = this.windows.find(k => {
          if (k.minimized || k.id === keep) return false;
          return this.windows.some(m => m !== k && !m.minimized && ratio(k.frac, m.frac) > 0.2);
        });
        if (!clash) return;
        const taken = this.windows.filter(w => w !== clash && !w.minimized).map(w => w.frac);
        const free = this._largestFreeRect(taken);
        if (free && free.w >= MIN_SIDE && free.h >= MIN_SIDE) {
          clash.frac = free;
          clash.maximized = false;
        } else {
          clash.minimized = true;
        }
      }
    },

    // ── 창과 창 사이 경계 ────────────────────────────────
    /** 지금 배치에서 끌 수 있는 경계들 */
    get dividers() {
      const open = this.windows.filter(w => !w.minimized && !w.maximized);
      if (open.length <= 1) return [];
      const out = [];
      const key = v => Math.round(v * 1000) / 1000;

      const axis = (vertical) => {
        const seen = {};
        open.forEach(w => { seen[key(vertical ? maxX(w.frac) : maxY(w.frac))] = true; });
        Object.keys(seen).map(Number).forEach(p => {
          if (!(p > 0.02 && p < 0.98)) return;
          const before = open.filter(w => Math.abs((vertical ? maxX(w.frac) : maxY(w.frac)) - p) < EDGE_EPS);
          const after = open.filter(w => Math.abs((vertical ? w.frac.x : w.frac.y) - p) < EDGE_EPS);
          if (!before.length || !after.length) return;
          const s = Math.max(
            Math.min.apply(null, before.map(w => vertical ? w.frac.y : w.frac.x)),
            Math.min.apply(null, after.map(w => vertical ? w.frac.y : w.frac.x)));
          const e = Math.min(
            Math.max.apply(null, before.map(w => vertical ? maxY(w.frac) : maxX(w.frac))),
            Math.max.apply(null, after.map(w => vertical ? maxY(w.frac) : maxX(w.frac))));
          if (e - s <= 0.05) return;
          // id 에 위치를 넣으면 끄는 도중 id 가 바뀌어 끌기가 끊긴다 — 이름으로만 만든다
          out.push({
            id: (vertical ? 'v|' : 'h|') + before.map(w => w.id).sort().join(',') +
                '|' + after.map(w => w.id).sort().join(','),
            axis: vertical ? 'v' : 'h', position: p, start: s, end: e,
            before: before.map(w => w.id), after: after.map(w => w.id)
          });
        });
      };
      axis(true); axis(false);
      return out;
    },

    /** 경계를 끌어 양쪽 창을 함께 늘리고 줄인다 (빈 틈이 생기지 않는다) */
    moveDivider(d, raw) {
      const before = this.windows.filter(w => d.before.indexOf(w.id) >= 0);
      const after = this.windows.filter(w => d.after.indexOf(w.id) >= 0);
      if (!before.length || !after.length) return;
      const v = d.axis === 'v';
      const mp = v ? this.minPaneX : this.minPaneY;
      const lower = Math.max.apply(null, before.map(w => (v ? w.frac.x : w.frac.y) + mp));
      const upper = Math.min.apply(null, after.map(w => (v ? maxX(w.frac) : maxY(w.frac)) - mp));
      if (lower >= upper) return;

      // 0.4% 단위로 끊어 다시 그리는 횟수를 반으로 줄인다
      const want = Math.min(Math.max(raw, lower), upper);
      const pos = Math.round(want * 250) / 250;
      if (Math.abs(pos - d.position) <= 0.0005) return;

      if (v) {
        before.forEach(w => { w.frac.w = pos - w.frac.x; });
        after.forEach(w => { const right = maxX(w.frac); w.frac.x = pos; w.frac.w = right - pos; });
      } else {
        before.forEach(w => { w.frac.h = pos - w.frac.y; });
        after.forEach(w => { const bottom = maxY(w.frac); w.frac.y = pos; w.frac.h = bottom - pos; });
      }
      d.position = pos;
      this._clampAll();
      this.emit('frames');
    },

    // ── 끌어서 자리 옮기기 (그리드에 맞춰 붙는다) ──────────
    beginDrag(id) {
      this._zoneCache = this._snapZones(id);
      this.drag.dragging = id;
      this.focus(id);
    },

    /** 끌고 있는 동안, 창 중심이 가리키는 자리를 미리 보여 준다 */
    updateDrag(id, center) {
      const zone = this._snapZone(id, center);
      const now = zone ? zone.rect : null;
      const was = this.drag.zone ? this.drag.zone.rect : null;
      if (!same(now, was)) {
        this.drag.zone = zone;
        this.emit('drag');
      }
    },

    endDrag(id) {
      const zone = this.drag.zone;
      this.drag.zone = null;
      this.drag.dragging = null;
      this._zoneCache = [];
      if (zone) this._place(id, zone);
      this.emit('drag');
      this.emit('layout');
    },

    cancelDrag() {
      this.drag.zone = null;
      this.drag.dragging = null;
      this._zoneCache = [];
      this.emit('drag');
    },

    /** 지금 끌고 있는 창이 놓일 수 있는 자리들 */
    _snapZones(id) {
      const others = this.windows.filter(w => !w.minimized && w.id !== id);
      const zones = [];
      const mx = this.minPaneX, my = this.minPaneY;

      others.forEach(w => {
        const f = w.maximized ? R(0, 0, 1, 1) : w.frac;
        const bandW = f.w * 0.25, bandH = f.h * 0.25;
        // 가운데로 끌면 자리를 맞바꾼다
        zones.push({ rect: f, hit: inset(f, bandW, bandH), owner: w.id, remainder: null });
        // 가장자리로 끌면 그 창을 반으로 나눠 들어간다
        if (f.w / 2 >= mx) {
          const left = R(f.x, f.y, f.w / 2, f.h);
          const right = R(midX(f), f.y, f.w / 2, f.h);
          zones.push({ rect: left, hit: R(f.x, f.y, bandW, f.h), owner: w.id, remainder: right });
          zones.push({ rect: right, hit: R(maxX(f) - bandW, f.y, bandW, f.h), owner: w.id, remainder: left });
        }
        if (f.h / 2 >= my) {
          const top = R(f.x, f.y, f.w, f.h / 2);
          const bottom = R(f.x, midY(f), f.w, f.h / 2);
          zones.push({ rect: top, hit: R(f.x, f.y, f.w, bandH), owner: w.id, remainder: bottom });
          zones.push({ rect: bottom, hit: R(f.x, maxY(f) - bandH, f.w, bandH), owner: w.id, remainder: top });
        }
      });

      // 비어 있는 자리
      const taken = others.map(w => w.maximized ? R(0, 0, 1, 1) : w.frac);
      const free = this._largestFreeRect(taken);
      if (free && free.w >= MIN_SIDE && free.h >= MIN_SIDE) {
        zones.push({ rect: free, hit: free, owner: null, remainder: null });
      }

      // 열린 창이 없으면 기본 배치와 절반·사분면을 쓴다
      if (!others.length) {
        const base = [R(0, 0, 1, 1),
          R(0, 0, 0.5, 1), R(0.5, 0, 0.5, 1),
          R(0, 0, 1, 0.5), R(0, 0.5, 1, 0.5),
          R(0, 0, 0.5, 0.5), R(0.5, 0, 0.5, 0.5), R(0, 0.5, 0.5, 0.5), R(0.5, 0.5, 0.5, 0.5)];
        const home = this.defaultLayout().find(w => w.id === id);
        if (home) base.unshift(home.frac);
        base.forEach(r => zones.push({ rect: r, hit: r, owner: null, remainder: null }));
      }
      return zones;
    },

    /* 창 중심이 들어 있는 자리 중 가장 작은 것.
       손끝이 어느 자리에도 없으면 미리보기를 띄우지 않는다 — 먼 자리를 억지로 고르면 화면이 튄다 */
    _snapZone(id, center) {
      const zones = this._zoneCache.length ? this._zoneCache : this._snapZones(id);
      const inside = zones.filter(z => contains(z.hit, center));
      if (!inside.length) return null;
      return inside.reduce((a, b) => (a.hit.w * a.hit.h < b.hit.w * b.hit.h ? a : b));
    },

    /** 자리 배치. 맞부딪힌 창은 자리를 바꾸거나 남은 반쪽으로 물러난다 (겹치지 않게) */
    _place(id, zone) {
      const w = this.win(id);
      if (!w) return;
      const origin = w.frac;
      w.frac = Object.assign({}, zone.rect);
      w.maximized = false;
      if (zone.owner) {
        const o = this.win(zone.owner);
        if (o) { o.frac = Object.assign({}, zone.remainder || origin); o.maximized = false; }
      }
      this._resolveOverlaps(id);
      this._tidyEdges();
      this._fillGapsIfNeeded();
    },

    // ── 작업표시줄 단추 ──────────────────────────────────
    resetLayout() {
      this.windows = this.defaultLayout();
      this.zTop = 20;
      this.focused = 'map';
      this.emit('layout');
    },

    tile(count) {
      const ids = this.visible.slice(-count).map(w => w.id);
      const spots = count === 2
        ? [R(0, 0, 0.5, 1), R(0.5, 0, 0.5, 1)]
        : [R(0, 0, 0.5, 0.5), R(0.5, 0, 0.5, 0.5), R(0, 0.5, 0.5, 0.5), R(0.5, 0.5, 0.5, 0.5)];
      ids.forEach((id, n) => {
        if (n >= spots.length) return;
        const w = this.win(id);
        if (w) { w.frac = Object.assign({}, spots[n]); w.maximized = false; w.minimized = false; }
      });
      this.emit('layout');
    },

    cycleFocus(step) {
      const opened = this.windows.filter(w => !w.minimized).map(w => w.id);
      if (!opened.length) return;
      const i = Math.max(0, opened.indexOf(this.focused));
      this.focus(opened[(i + step + opened.length) % opened.length]);
    }
  };

  /** 가까운 값들을 한 덩어리로 묶어 대표값을 낸다. 화면 끝(0, 1)은 그대로 둔다 */
  function cluster(values, tolerance) {
    const tol = tolerance == null ? 0.03 : tolerance;
    const sorted = values.slice().sort((a, b) => a - b);
    const out = [];
    let group = [];
    const flush = () => {
      if (!group.length) return;
      if (group.some(v => v < 0.004)) out.push(0);
      else if (group.some(v => v > 0.996)) out.push(1);
      else out.push(group.reduce((a, b) => a + b, 0) / group.length);
      group = [];
    };
    sorted.forEach(v => {
      if (group.length && v - group[group.length - 1] > tol) flush();
      group.push(v);
    });
    flush();
    return out;
  }
  function snapTo(v, values) {
    let best = v, bestD = Infinity;
    values.forEach(x => { const d = Math.abs(x - v); if (d < bestD) { bestD = d; best = x; } });
    return best;
  }
  /** 두 자리가 얼마나 겹치는지 (작은 쪽 기준) */
  function ratio(a, b) {
    const o = overlapArea(a, b);
    if (!o) return 0;
    const smaller = Math.min(a.w * a.h, b.w * b.h);
    return smaller > 0 ? o / smaller : 0;
  }

  wm.windows = wm.defaultLayout();
  PX.wm = wm;
})(window.PX);

</script>
<script>
/* ===== screen-overview.js ===== */
/* 전체 상황: 상황 요약 · 사건 브리핑 · 사건 목록
   OverviewScreen.swift 를 옮긴 것.
   SwiftUI 는 @State(query) 나 @EnvironmentObject 가 바뀌면 body 를 다시 만들지만
   여기서는 그런 것이 없어, 바뀔 수 있는 세 덩어리를 paint() 로 다시 그린다.
   창 크기(tile)가 바뀌면 덜어 내는 내용 자체가 달라지므로 build() 로 통째로 다시 세운다. */

(function (PX) {
  'use strict';

  var esc = PX.esc;

  /** 점은 자리를 늘 차지한다 — 점이 없는 줄과 글 시작점을 맞추기 위해서다 */
  function dotGutter(prio) {
    return '<span class="ov-gutter">' + (prio ? PX.dot(prio, 7) : '') + '</span>';
  }

  function metricHTML(title, value, prio) {
    return '<div class="ov-metric">' + dotGutter(prio) +
      '<span class="ov-m-t cap sec">' + esc(title) + '</span>' +
      /* 값을 칸 오른쪽에 붙인다 — 칸 폭이 같으므로 숫자가 한 줄로 선다 */
      '<span class="ov-m-v mono">' + esc(value) + '</span>' +
      '</div>';
  }

  PX.screens.overview = {
    mount: function (bodyEl, ctx) {
      var store = ctx.store;
      var tile = ctx.tile || PX.tile(400, 300);
      var query = '';

      var root = PX.el('<div class="ov-root"><div class="ov-pad"></div></div>');
      bodyEl.appendChild(root);
      var pad = root.firstElementChild;

      var elSummary, elBriefing, elCount, elSearch, elRows;
      var visibleRows = [];

      // ── 검색에 걸린 사건들 ───────────────────────────────
      function rowsFor() {
        var q = query.trim();
        if (!q) return store.incidents.slice();
        return store.incidents.filter(function (i) {
          return (i.id + ' ' + i.type + ' ' + i.place + ' ' + i.team).indexOf(q) >= 0;
        });
      }

      // ── 틀 세우기 (크기 규칙이 바뀔 때마다) ────────────────
      function build() {
        var keepScroll = root.scrollTop;
        var focused = elSearch && document.activeElement === elSearch;
        var caret = focused ? elSearch.selectionStart : 0;

        // 크기에 따라 달라지는 값은 CSS 변수로 한 번만 내려 준다
        root.style.setProperty('--ov-inset', tile.inset + 'px');
        root.style.setProperty('--ov-blockgap', tile.blockGap + 'px');
        // cardInset: 좁으면 16, 아니면 20
        root.style.setProperty('--ov-cardinset', (tile.isNarrow ? 16 : 20) + 'px');
        root.style.setProperty('--ov-mgap', (tile.isNarrow ? 10 : 16) + 'px');
        root.style.setProperty('--ov-secgap', (tile.isShort ? 10 : 16) + 'px');
        root.style.setProperty('--ov-rowpad', (tile.isShort ? 7 : 10) + 'px');
        root.style.setProperty('--ov-nametop-pb', (tile.isVeryNarrow ? 0 : 6) + 'px');
        root.classList.toggle('is-narrow', tile.isNarrow);
        root.classList.toggle('is-very-narrow', tile.isVeryNarrow);
        root.classList.toggle('is-tiny', tile.isTiny);
        root.classList.toggle('is-short', tile.isShort);
        root.classList.toggle('is-very-short', tile.isVeryShort);

        pad.innerHTML =
          '<div class="ov-summary"></div>' +
          '<hr class="hair ov-blockdiv">' +
          '<div class="ov-briefing"></div>' +
          '<hr class="hair ov-blockdiv">' +
          '<div class="ov-list">' +
            '<div class="ov-list-head">' +
              '<span class="cap sec">사건 목록</span>' +
              '<span class="cap sec ov-count"></span>' +
            '</div>' +
            // 낮으면 검색칸을 접는다 — 목록 몇 줄이라도 보이는 편이 낫다
            (tile.isVeryShort ? '' :
              '<div class="ov-search">' + PX.icon('search') +
              '<input type="search" class="ov-search-in" placeholder="사건 검색" aria-label="사건 검색">' +
              '</div>') +
            '<div class="ov-rows"></div>' +
          '</div>';

        elSummary = pad.querySelector('.ov-summary');
        elBriefing = pad.querySelector('.ov-briefing');
        elCount = pad.querySelector('.ov-count');
        elRows = pad.querySelector('.ov-rows');
        elSearch = pad.querySelector('.ov-search-in');

        if (elSearch) {
          elSearch.value = query;
          elSearch.addEventListener('input', function () {
            query = elSearch.value;
            paintList();
          });
          if (focused) {
            elSearch.focus();
            try { elSearch.setSelectionRange(caret, caret); } catch (e) { /* 무시 */ }
          }
        }

        paint();
        root.scrollTop = keepScroll;
      }

      // ── 상황 요약 줄 ─────────────────────────────────────
      function paintSummary() {
        var active = store.activeIncidents;
        var html =
          metricHTML('진행 중 사건', String(active.length)) +
          metricHTML('긴급 사건',
            String(active.filter(function (i) { return i.priority === '긴급'; }).length), '긴급');
        // 아주 좁으면 지표를 둘만 남긴다 — 넷이 두 줄로 접히면 오히려 읽기 어렵다
        if (!tile.isTiny) {
          html += metricHTML('투입 인원',
            String(store.officers.filter(function (o) { return !!o.incidentID; }).length));
          html += metricHTML('통신 이상',
            String(store.officers.filter(function (o) {
              return o.ar === '불안정' || o.ar === '두절';
            }).length), '주의');
        }
        elSummary.innerHTML = html;
      }

      // ── 사건 브리핑 ──────────────────────────────────────
      function paintBriefing() {
        var inc = store.selectedIncident;
        if (!inc) { elBriefing.innerHTML = ''; return; }

        var hazards = inc.hazards || [];
        var showHaz = hazards.length > 0 && !tile.isVeryShort;
        // 위험 요소가 없거나 아주 낮으면 ③ 아래 여백을 카드 여백과 같게 둔다
        var whoBottom = showHaz ? '11px' : 'var(--ov-cardinset)';

        var html =
          // 머리글은 배경으로 물러난다 — 굵은 글씨가 많으면 어디를 볼지 알 수 없다
          '<div class="ov-sec-title cap sec">사건 브리핑</div>' +
          // 바깥은 한 덩어리, 안은 구역으로 나눈다.
          // 카드를 넷으로 쪼개면 화면이 시끄럽고, 선이 없으면 정보가 흘러내린다 —
          // 애플의 그룹 목록처럼 한 판 안에서 얇은 선으로 가른다.
          '<div class="ov-card">' +
            // ① 무슨 사건인가 — 이름은 왼쪽 그리드에서 시작하고,
            //    긴급도와 사건 번호는 읽고 나서 확인하는 값이라 오른쪽 끝에 함께 모은다
            '<div class="ov-card-head">' +
              '<span class="ov-inc-type">' + esc(inc.type) + '</span>' +
              '<span class="ov-head-right">' +
                '<span class="ov-prio cap sec">' + PX.dot(inc.priority, 7) + esc(inc.priority) + '</span>' +
                '<span class="ov-inc-id cap sec mono">' + esc(inc.id) + '</span>' +
              '</span>' +
            '</div>' +
            // ② 지금 무슨 일인가 — 읽어야 할 한 문장
            '<div class="ov-card-sum">' + esc(inc.summary) + '</div>' +
            '<hr class="hair">' +
            // ③ 누가 맡았고 어디인가 — 확인용
            '<div class="ov-card-who cap sec" style="padding-bottom:' + whoBottom + '">' +
              esc(inc.team + ' · ' + inc.place) +
            '</div>' +
            // ④ 조심할 것 — 경고 아이콘 거터로 한눈에 갈린다
            (showHaz
              ? '<hr class="hair">' +
                '<div class="ov-card-haz">' +
                  '<span class="ov-haz-ic" title="위험 요소" aria-label="위험 요소">' +
                    PX.icon('warning') + '</span>' +
                  '<div class="ov-haz-list">' +
                    hazards.map(function (h) { return '<div>' + esc(h) + '</div>'; }).join('') +
                  '</div>' +
                '</div>'
              : '') +
          '</div>';

        elBriefing.innerHTML = html;
      }

      // ── 사건 목록 ────────────────────────────────────────
      function rowHTML(inc, selected) {
        var prio = inc.priority;
        var parts = '';

        if (!tile.isNarrow) {
          parts += '<span class="ov-row-id cap sec">' + esc(inc.id) + '</span>';
        }

        var main =
          '<div class="ov-row-top">' +
            // 일반 사건의 회색 점은 알려 주는 것이 없다 — 거터만 비워 두고 정렬은 지킨다
            dotGutter(prio === '일반' ? null : prio) +
            '<span class="ov-row-type">' + esc(inc.type) + '</span>' +
            // 좁으면 둘째 줄을 통째로 빼므로, ID 는 이름 줄 끝에 남긴다
            (tile.isNarrow ? '<span class="ov-row-idr cap sec">' + esc(inc.id) + '</span>' : '') +
          '</div>';

        // 좁은 폭에서는 이 줄이 없어도 목록을 쓸 수 있다 — 회색 문장이 절반을 먹지 않게 뺀다
        if (!tile.isNarrow) {
          main += '<div class="ov-row-sub ov-row-where cap sec">' +
            esc(inc.place + ' · 발생 ' + inc.reportedAt) + '</div>';
        }
        if (!tile.isVeryNarrow) {
          main += '<div class="ov-row-sub cap sec">' +
            esc(inc.status + ' · 투입 ' + store.officersOf(inc.id).length + '명 · ' + inc.team) +
            '</div>';
        }

        return '<div class="ov-row' + (selected ? ' sel' : '') + '" data-id="' + esc(inc.id) + '">' +
          parts + '<div class="ov-row-main">' + main + '</div></div>';
      }

      function paintList() {
        visibleRows = rowsFor();
        var total = store.incidents.length;
        elCount.textContent = visibleRows.length === total
          ? total + '건'
          : visibleRows.length + ' / ' + total + '건';

        var sel = store.selectedIncidentID;
        var html = '';
        visibleRows.forEach(function (inc, i) {
          html += rowHTML(inc, inc.id === sel);
          // 선택된 행에 닿는 선은 그리지 않는다 — 둥근 하이라이트를 가로질러 잘린 것처럼 보인다
          if (i < visibleRows.length - 1) {
            var touches = inc.id === sel || visibleRows[i + 1].id === sel;
            if (!touches) html += '<hr class="hair">';
          }
        });
        elRows.innerHTML = html;
      }

      function paint() {
        paintSummary();
        paintBriefing();
        paintList();
      }

      // 행을 누르면 사건을 바꾼다 (다른 화면도 함께 따라온다).
      // pad 는 다시 세워도 그대로 있으므로 위임으로 한 번만 단다.
      pad.addEventListener('click', function (e) {
        var row = e.target.closest ? e.target.closest('.ov-row') : null;
        if (!row || !pad.contains(row)) return;
        store.select(row.dataset.id);
      });

      build();

      // 다른 화면이 사건·인력을 바꾸면 여기도 따라 바뀐다 (@Published 자리)
      var off = store.subscribe(function () { paint(); });

      return {
        resize: function (t) {
          var was = tile;
          tile = t;
          // 크기 규칙이 하나라도 달라졌을 때만 다시 세운다
          var changed =
            was.inset !== t.inset || was.blockGap !== t.blockGap ||
            was.isNarrow !== t.isNarrow || was.isVeryNarrow !== t.isVeryNarrow ||
            was.isTiny !== t.isTiny || was.isShort !== t.isShort ||
            was.isVeryShort !== t.isVeryShort;
          if (changed) build();
        },
        destroy: function () {
          off();
          bodyEl.innerHTML = '';
        }
      };
    }
  };
})(window.PX);

</script>
<script>
/* ===== screen-map.js ===== */
/* 작전 지도 — MapScreen.swift + MapSupport.swift 를 옮긴 것.

   애플 지도(MapKit)는 브라우저에서 쓸 수 없다(유료 키가 필요하다).
   그래서 MapLibre + OpenFreeMap 벡터 타일로 대신하되, **보이는 것과 동작은 Swift 판에 맞춘다** —
   주변 장소(POI) 표시를 끄고 길·행정구역 이름만 남기고, 3D 는 카메라를 기울여 건물을 세운다. */
(function (PX) {
  'use strict';

  const STYLE = 'https://tiles.openfreemap.org/styles/liberty';
  // 다크 모드에서는 지도도 같이 어두워져야 한다 — 맥 판은 애플 지도가 알아서 뒤집힌다
  const STYLE_DARK = 'https://tiles.openfreemap.org/styles/dark';
  const SAT = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
  const SEOUL = { center: [126.978, 37.5665], zoom: 12.4 };

  const KINDS = [
    { id: 'standard', name: '기본', icon: 'map' },
    { id: 'satellite', name: '위성', icon: 'globe' },
    { id: 'threeD', name: '3D', icon: 'cube' }
  ];

  const COLOR = { incident: '#ff3b30', unit: '#007aff', camera: '#5a57d6' };
  const SYMBOL = { incident: 'exclaim', unit: 'officer', camera: 'cctv', car: 'car' };

  const ll = p => PX.data.mapPoint.toLatLng(p);          // {x,y} → {latitude, longitude}
  const lngLat = p => { const c = ll(p); return [c.longitude, c.latitude]; };

  // ═══ 상황 재생 시계 (OpsClock) ═══════════════════════
  //  지금까지 지도는 21:00 에 얼어붙어 있었다. 시계를 붙이면 상황이 흐른다.
  function makeClock() {
    const nowMin = PX.data.clock.nowMin;
    return {
      now: nowMin,
      playing: false,
      // 느려야 인력이 어디로 가는지 눈으로 따라갈 수 있다 — 0.25 면 20 분을 80 초에 걸쳐 본다
      speed: 0.25,
      span: [nowMin - 30, nowMin],
      timer: null,
      onTick: null,
      get isLive() { return this.now >= this.span[1] - 0.01; },
      get label() { return PX.clockText(this.now); },
      /** 고른 사건이 바뀌면 그 접수 시각부터 흐르게 맞춘다 (범위가 너무 짧으면 최소 20분) */
      retarget(reportedAt) {
        const from = PX.hm(reportedAt), upper = nowMin;
        this.span = [Math.min(from, upper - 20), upper];
        this.now = Math.min(Math.max(this.now, this.span[0]), this.span[1]);
      },
      goLive() { this.stop(); this.now = this.span[1]; if (this.onTick) this.onTick(); },
      replay() { this.now = this.span[0]; this.play(); },
      play() {
        if (this.playing) return;
        if (this.isLive) this.now = this.span[0];      // 끝에서 누르면 처음으로
        this.playing = true;
        const step = 1 / 10;                            // 1초에 열 번 — 부드럽고 무겁지 않다
        this.timer = setInterval(() => {
          this.now += this.speed * step;
          if (this.now >= this.span[1]) { this.now = this.span[1]; this.stop(); }
          if (this.onTick) this.onTick();
        }, step * 1000);
      },
      stop() {
        if (this.timer) clearInterval(this.timer);
        this.timer = null;
        this.playing = false;
        if (this.onTick) this.onTick();
      },
      toggle() { this.playing ? this.stop() : this.play(); }
    };
  }

  /** 경로 위 그 시각의 자리 — 소수 분을 받아 인력이 뚝뚝 끊기지 않고 미끄러지게 */
  function routePoint(r, t) {
    const s = r.stops;
    if (!s.length) return null;
    if (t <= s[0].t) return s[0].p;
    if (t >= s[s.length - 1].t) return s[s.length - 1].p;
    for (let i = 0; i < s.length - 1; i++) {
      const a = s[i], b = s[i + 1];
      if (t >= a.t && t <= b.t) {
        const k = (t - a.t) / Math.max(1, b.t - a.t);
        return { x: a.p.x + (b.p.x - a.p.x) * k, y: a.p.y + (b.p.y - a.p.y) * k };
      }
    }
    return s[s.length - 1].p;
  }
  /** 그 시각까지 지나온 길. 아직 안 간 곳은 그리지 않는다 */
  function routeTravelled(r, t) {
    const s = r.stops;
    if (!s.length || t <= s[0].t) return [];
    const pts = [s[0].p];
    s.slice(1).forEach(x => { if (x.t <= t) pts.push(x.p); });
    const head = routePoint(r, t);
    const last = pts[pts.length - 1];
    if (head && (head.x !== last.x || head.y !== last.y)) pts.push(head);
    return pts.map(lngLat);
  }
  const routeOf = id => PX.data.patrolRoutes.find(r => r.id === id);

  // ═══ 묶기 (MapClustering) ═════════════════════════════
  //  화면 48px 에 해당하는 위경도 거리로 묶는다 (확대하면 자연히 풀린다)
  function clusterItems(items, lonSpan, viewWidth) {
    if (!viewWidth) return items.map(i => ({ items: [i] }));
    const radius = lonSpan * (48 / viewWidth);
    const out = [];
    items.forEach(item => {
      const hit = out.find(c => {
        const p = center(c);
        const dx = p[0] - item.lngLat[0];
        const dy = (p[1] - item.lngLat[1]) * 1.3;    // 위도 1도가 경도보다 길다
        return Math.sqrt(dx * dx + dy * dy) < radius;
      });
      if (hit) hit.items.push(item); else out.push({ items: [item] });
    });
    return out;
  }
  function center(c) {
    if (c.items.length === 1) return c.items[0].lngLat;
    let x = 0, y = 0;
    c.items.forEach(i => { x += i.lngLat[0]; y += i.lngLat[1]; });
    return [x / c.items.length, y / c.items.length];
  }
  const clusterID = c => c.items.map(i => i.id).sort().join(',');

  // ═══ 화면 ════════════════════════════════════════════
  function mount(body, ctx) {
    const store = ctx.store;
    let tile = ctx.tile;

    const S = {
      kind: 'standard',
      showKindMenu: false,
      showIncidents: false,
      showUnits: false,
      showCameras: false,
      sidebarOpen: true,
      caseListOpen: true,
      openedCase: null,
      hoveredItemID: null,
      selectedRowID: null,
      query: '',
      results: [],
      searchPin: null,
      popoverCamera: null,
      briefIncident: null,
      arMode: 'off'          // off | pip | full
    };
    const clock = makeClock();

    body.classList.add('mp-root');
    body.innerHTML =
      `<div class="mp-canvas"></div>
       <div class="mp-markers"></div>
       <aside class="mp-sidebar glass"></aside>
       <button class="mp-toggle glass" title="사이드바 펼치기">${PX.icon('sidebar')}</button>
       <div class="mp-controls"></div>
       <div class="mp-cards"></div>
       <div class="mp-play glass"></div>
       <div class="mp-ar"></div>`;

    const canvasEl = body.querySelector('.mp-canvas');
    const markerEl = body.querySelector('.mp-markers');
    const sideEl = body.querySelector('.mp-sidebar');
    const toggleEl = body.querySelector('.mp-toggle');
    const ctlEl = body.querySelector('.mp-controls');
    const cardEl = body.querySelector('.mp-cards');
    const playEl = body.querySelector('.mp-play');
    const arEl = body.querySelector('.mp-ar');

    // ── 지도 ──
    const map = new maplibregl.Map({
      container: canvasEl,
      style: STYLE,
      center: SEOUL.center,
      zoom: SEOUL.zoom,
      attributionControl: { compact: true }
    });
    // 나침반과 확대는 정품 컨트롤이 맡는다 — 나침반을 누르면 북으로 돌아간다
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-right');
    const geo = new maplibregl.GeolocateControl({
      positionOptions: { enableHighAccuracy: true },
      trackUserLocation: false,
      showUserLocation: true
    });
    map.addControl(geo, 'bottom-right');

    let styleReady = false;
    function setupStyle() {
      hidePOI();
      addSatellite();
      addLineLayers();
      styleReady = true;
      applyKind(S.kind);
      drawAll();
    }
    map.on('load', setupStyle);
    /* 스타일을 갈아 끼우면 우리가 얹은 선(경로·관계선)과 위성 층이 전부 날아간다.
       그래서 새 스타일이 올라올 때마다 처음부터 다시 세운다. */
    function swapStyle(dark) {
      styleReady = false;
      map.setStyle(dark ? STYLE_DARK : STYLE);
      map.once('style.load', setupStyle);
    }
    map.on('move', () => { drawMarkers(); drawCards(); });
    map.on('render', () => { drawCards(); });

    /* 주변 장소(상점·병원·역 등) 표시는 모두 끈다 — 사건 표식과 섞여 읽기 어렵다.
       길·대로·행정구역 이름은 그대로 남는다. */
    function hidePOI() {
      map.getStyle().layers.forEach(l => {
        if (/poi/i.test(l.id)) map.setLayoutProperty(l.id, 'visibility', 'none');
      });
      koreanLabels();
    }

    /* 글자는 한국어로. 타일은 영어 이름을 기본으로 주므로 name:ko 가 있으면 그것을 쓴다 —
       애플 지도처럼 「퇴계로」로 보여야지 「Toegye-ro」가 섞이면 읽기 나쁘다 */
    function koreanLabels() {
      map.getStyle().layers.forEach(l => {
        if (l.type !== 'symbol') return;
        const f = (l.layout || {})['text-field'];
        if (!f) return;
        try {
          map.setLayoutProperty(l.id, 'text-field',
            ['coalesce', ['get', 'name:ko'], ['get', 'name:latin'], ['get', 'name']]);
        } catch (e) { /* 이 층은 이름을 안 쓴다 */ }
      });
    }

    /* 위성은 스타일을 통째로 갈지 않고 **밑에 깔기만** 한다.
       스타일을 바꾸면 우리가 얹은 선과 표식이 전부 날아가 다시 만들어야 한다. */
    function addSatellite() {
      map.addSource('sat', { type: 'raster', tiles: [SAT], tileSize: 256, maxzoom: 19 });
      const first = map.getStyle().layers[0];
      map.addLayer({ id: 'sat', type: 'raster', source: 'sat', layout: { visibility: 'none' } }, first.id);
    }

    function addLineLayers() {
      map.addSource('tracks', { type: 'geojson', data: empty() });
      map.addSource('links', { type: 'geojson', data: empty() });
      map.addLayer({
        id: 'links', type: 'line', source: 'links',
        paint: {
          'line-width': 3,
          'line-color': ['case', ['get', 'report'], '#ff3b30', '#007aff']
        },
        layout: { 'line-cap': 'round' }
      });
      // 지나온 길 — 점점 자라는 선이 곧 「움직임」이다
      map.addLayer({
        id: 'tracks', type: 'line', source: 'tracks',
        paint: { 'line-width': 3, 'line-color': '#007aff', 'line-opacity': 0.75 },
        layout: { 'line-cap': 'round', 'line-join': 'round' }
      });
    }
    const empty = () => ({ type: 'FeatureCollection', features: [] });

    /* 지도 종류를 바꿀 때 카메라도 같이 맞춘다.
       3D 는 스타일만 바꿔서는 평면과 똑같아 보인다 — 카메라를 기울여야 건물이 선다. */
    function applyKind(k) {
      if (!styleReady) return;
      S.kind = k;
      const sat = k === 'satellite';
      map.setLayoutProperty('sat', 'visibility', sat ? 'visible' : 'none');
      // 위성일 때는 벡터 바탕(땅·물·건물·길)을 감추고 글자만 남긴다
      map.getStyle().layers.forEach(l => {
        if (l.id === 'sat' || l.id === 'tracks' || l.id === 'links') return;
        if (/poi/i.test(l.id)) return;
        if (l.type === 'symbol') return;
        map.setLayoutProperty(l.id, 'visibility', sat ? 'none' : 'visible');
      });
      map.easeTo({ pitch: k === 'threeD' ? 60 : 0, duration: 700 });
      draw3DBuildings(k === 'threeD');
      drawControls();
    }

    function draw3DBuildings(on) {
      const has = map.getLayer('px-3d');
      if (!on) { if (has) map.setLayoutProperty('px-3d', 'visibility', 'none'); return; }
      if (has) { map.setLayoutProperty('px-3d', 'visibility', 'visible'); return; }
      if (!map.getSource('openmaptiles')) return;
      try {
        map.addLayer({
          id: 'px-3d', type: 'fill-extrusion', source: 'openmaptiles', 'source-layer': 'building',
          minzoom: 13,
          paint: {
            'fill-extrusion-color': '#c9ccd4',
            'fill-extrusion-height': ['coalesce', ['get', 'render_height'], 8],
            'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
            'fill-extrusion-opacity': 0.75
          }
        });
      } catch (e) { /* 스타일에 건물 자료가 없으면 그냥 평면으로 둔다 */ }
    }

    // ── 표식 목록 (items / focusItems) ──
    /** 그 시각의 인력 자리. 아직 출동 전이면 지도에 세우지 않는다(null) */
    function officerPoint(o) {
      const r = routeOf(o.id);
      if (!r) return o.point;                       // 경로가 없는 인력(대기 등)은 늘 제자리
      if (clock.now < r.stops[0].t) return null;
      return routePoint(r, clock.now);
    }
    /** 되감아 보는 동안에만 지나온 길을 남긴다 — 「지금」 화면은 평소와 똑같아야 한다 */
    const showsTracks = () => clock.playing || !clock.isLive;

    /** 지금 지도에 세우기로 한 인력 (사건을 열었으면 그 사건 것만) */
    function shownOfficers() {
      if (S.openedCase) {
        return store.officers.filter(o => o.incidentID && S.openedCase.reportIDs.indexOf(o.incidentID) >= 0);
      }
      return S.showUnits ? store.officers : [];
    }
    function trackRoutes() {
      if (!showsTracks() || (!S.showUnits && !S.openedCase)) return [];
      const shown = shownOfficers().map(o => o.id);
      return PX.data.patrolRoutes.filter(r => shown.indexOf(r.id) >= 0 && clock.now > r.stops[0].t);
    }

    const item = (id, kind, label, p, incidentID, symbol) =>
      ({ id: id, kind: kind, label: label, lngLat: lngLat(p), incidentID: incidentID, symbol: symbol });

    function items() {
      let list = [];
      if (S.showIncidents) {
        store.incidents.filter(i => i.status !== '종료').forEach(i =>
          list.push(item(i.id, 'incident', i.id + ' ' + i.type, i.point, i.id, 'incident')));
      }
      if (S.showUnits) {
        store.officers.forEach(o => {
          const p = officerPoint(o);
          if (!p) return;                            // 아직 출동 전
          list.push(item(o.id, 'unit', o.call + ' ' + o.name, p, o.incidentID, 'officer'));
        });
        store.vehicles.forEach(v => list.push(item(v.id, 'unit', v.label, v.point, v.incidentID, 'car')));
      }
      if (S.showCameras) {
        store.cameras.forEach(c => list.push(item(c.id, 'camera', c.id + ' ' + c.name, c.point, c.incidentID, 'camera')));
      }
      // 사건을 열면 그 사건 항목은 묶지 않고 따로 또렷하게 보여 준다
      if (S.openedCase) {
        const have = {};
        list.forEach(i => { have[i.id] = true; });
        focusItems(S.openedCase).forEach(i => { if (!have[i.id]) list.push(i); });
      }
      return list;
    }

    function focusItems(group) {
      const list = [];
      group.reportIDs.forEach(rid => {
        const inc = store.incidents.find(i => i.id === rid);
        if (inc) list.push(item(inc.id, 'incident', inc.id + ' ' + inc.type, inc.point, inc.id, 'incident'));
        store.officers.filter(o => o.incidentID === rid).forEach(o => {
          const p = officerPoint(o);
          if (p) list.push(item(o.id, 'unit', o.call + ' ' + o.name, p, rid, 'officer'));
        });
        store.vehiclesOf(rid).forEach(v => list.push(item(v.id, 'unit', v.label, v.point, rid, 'car')));
        store.camerasOf(rid).forEach(c => list.push(item(c.id, 'camera', c.id + ' ' + c.name, c.point, rid, 'camera')));
      });
      return list;
    }
    const focusIDs = g => focusItems(g).map(i => i.id);

    function clusters() {
      const w = body.clientWidth;
      const b = map.getBounds();
      const lonSpan = Math.abs(b.getEast() - b.getWest());
      if (!S.openedCase) return clusterItems(items(), lonSpan, w);
      const ids = focusIDs(S.openedCase);
      const others = items().filter(i => ids.indexOf(i.id) < 0);
      return clusterItems(others, lonSpan, w).concat(focusItems(S.openedCase).map(i => ({ items: [i] })));
    }
    const isDimmed = c => S.openedCase ? focusIDs(S.openedCase).indexOf(c.items[0].id) < 0 : false;
    const isHighlighted = c => c.items.length === 1 &&
      (c.items[0].id === S.hoveredItemID || c.items[0].id === S.selectedRowID);

    // ── 표식 그리기 ──
    const markerCache = {};
    function drawMarkers() {
      if (!styleReady) return;
      const list = clusters();
      const seen = {};
      list.forEach(c => {
        const id = clusterID(c);
        seen[id] = true;
        let el = markerCache[id];
        if (!el) {
          el = document.createElement('button');
          el.className = 'mp-mark';
          el.addEventListener('click', ev => { ev.stopPropagation(); tap(c); });
          el.addEventListener('dblclick', ev => { ev.stopPropagation(); openBrief(c); });
          el.addEventListener('mouseenter', () => { S.hoveredItemID = c.items[0].id; });
          el.addEventListener('mouseleave', () => { if (S.hoveredItemID === c.items[0].id) S.hoveredItemID = null; });
          el.addEventListener('contextmenu', ev => { ev.preventDefault(); markerMenu(c, ev); });
          markerEl.appendChild(el);
          markerCache[id] = el;
        }
        el.__cluster = c;
        const group = c.items.length > 1;
        const kind = c.items[0].kind;
        const side = group ? (c.items.length >= 10 ? 46 : c.items.length >= 5 ? 40 : 34) : 28;
        const radius = (kind === 'camera' && !group) ? 9 : side / 2;
        el.style.width = el.style.height = side + 'px';
        el.style.borderRadius = radius + 'px';
        el.style.background = COLOR[kind];
        el.style.opacity = isDimmed(c) ? 0.3 : 1;
        el.style.setProperty('--halo', group ? COLOR[kind] + '48' : 'transparent');
        el.classList.toggle('big', isHighlighted(c));
        el.innerHTML = group
          ? `<b style="font-size:${c.items.length >= 10 ? 15 : 13}px">${c.items.length}</b>`
          : PX.icon(SYMBOL[c.items[0].symbol] || 'pin');
        const pt = map.project(center(c));
        el.style.transform = `translate(${pt.x}px, ${pt.y}px) translate(-50%, -50%)`;
        el.title = c.items.length === 1 ? c.items[0].label : c.items.length + '개';
      });
      Object.keys(markerCache).forEach(id => {
        if (!seen[id]) { markerCache[id].remove(); delete markerCache[id]; }
      });

      // 검색으로 찍은 자리
      let pin = markerEl.querySelector('.mp-searchpin');
      if (S.searchPin) {
        if (!pin) {
          pin = PX.el(`<div class="mp-searchpin">${PX.icon('pin')}</div>`);
          markerEl.appendChild(pin);
        }
        const pt = map.project(S.searchPin);
        pin.style.transform = `translate(${pt.x}px, ${pt.y}px) translate(-50%, -100%)`;
      } else if (pin) pin.remove();
    }

    // ── 선 (배정 관계선 · 지나온 길) ──
    function drawLines() {
      if (!styleReady) return;
      /* 배정 관계선: 인력·차량 → 신고 위치(파란 실선), 묶인 신고끼리(빨간 실선).
         되감는 동안에는 그리지 않는다 — 이동 경로와 같은 파란 직선이라 서로 헷갈린다 */
      const links = [];
      if (S.openedCase && !showsTracks()) {
        const g = S.openedCase;
        g.reportIDs.forEach(rid => {
          const inc = store.incidents.find(i => i.id === rid);
          if (!inc) return;
          store.officersOf(rid).forEach(o => links.push(line([lngLat(o.point), lngLat(inc.point)], false)));
          store.vehiclesOf(rid).forEach(v => links.push(line([lngLat(v.point), lngLat(inc.point)], false)));
        });
        const reports = g.reportIDs.map(id => store.incidents.find(i => i.id === id)).filter(Boolean);
        for (let i = 1; i < reports.length; i++) {
          links.push(line([lngLat(reports[i - 1].point), lngLat(reports[i].point)], true));
        }
      }
      map.getSource('links').setData({ type: 'FeatureCollection', features: links });

      const tracks = trackRoutes().map(r => routeTravelled(r, clock.now))
        .filter(c => c.length > 1).map(c => line(c, false));
      map.getSource('tracks').setData({ type: 'FeatureCollection', features: tracks });
    }
    const line = (coords, report) => ({
      type: 'Feature', properties: { report: !!report },
      geometry: { type: 'LineString', coordinates: coords }
    });

    // 묶인 신고 사이에 붙는 「연관 신고」 딱지
    function drawPairLabels() {
      PX.$$('.mp-pair', markerEl).forEach(e => e.remove());
      if (!S.openedCase || showsTracks()) return;
      const reports = S.openedCase.reportIDs.map(id => store.incidents.find(i => i.id === id)).filter(Boolean);
      for (let i = 1; i < reports.length; i++) {
        const a = ll(reports[i - 1].point), b = ll(reports[i].point);
        const pt = map.project([(a.longitude + b.longitude) / 2, (a.latitude + b.latitude) / 2]);
        const el = PX.el(`<span class="mp-pair">연관 신고</span>`);
        el.style.transform = `translate(${pt.x}px, ${pt.y}px) translate(-50%, -50%)`;
        markerEl.appendChild(el);
      }
    }

    // ── 카메라 이동 ──
    function fly(lonlat, zoomIn) {
      backToMap();
      map.easeTo({ center: lonlat, zoom: zoomIn ? Math.max(map.getZoom(), 15.2) : map.getZoom(), duration: 800 });
    }
    /** 3D 를 보던 중에 사건·인력·CCTV 를 고르면 지도로 돌아와 그 자리를 비춘다 */
    function backToMap() {
      S.briefIncident = null;
      if (S.arMode !== 'off') { S.arMode = 'off'; drawAR(); }
    }
    /** 묶음을 누르면 1~2.5단계만 확대해 맥락을 잃지 않게 한다 */
    function zoomTo(c) {
      const lons = c.items.map(i => i.lngLat[0]), lats = c.items.map(i => i.lngLat[1]);
      const pad = 1.6;
      const w = Math.max((Math.max.apply(null, lons) - Math.min.apply(null, lons)) * pad, 0.004);
      const h = Math.max((Math.max.apply(null, lats) - Math.min.apply(null, lats)) * pad, 0.004);
      const cur = map.getBounds();
      const span = Math.abs(cur.getEast() - cur.getWest());
      const want = Math.min(Math.max(Math.max(w, h), span / 2.5), span / 2);
      const zoom = map.getZoom() + Math.log2(span / want);
      map.easeTo({ center: center(c), zoom: Math.min(zoom, 19), duration: 700 });
    }
    /* 점들이 모두 보이게 지도를 맞춘다.
       사이드바와 떠 있는 조작부가 덮는 만큼은 여백으로 빼 줘야 그 아래 숨지 않는다. */
    function fitAll(points) {
      if (!points || !points.length) return;
      backToMap();
      const b = points.reduce((acc, p) => acc.extend(p), new maplibregl.LngLatBounds(points[0], points[0]));
      const side = (S.sidebarOpen && !tile.isNarrow)
        ? Math.min(220, Math.max(150, body.clientWidth * 0.32)) + 40 : 50;
      map.fitBounds(b, {
        padding: { top: 70, right: 70, bottom: 80, left: side },
        duration: 800,
        maxZoom: 15.5
      });
    }

    function fitCase(group) {
      backToMap();
      const pts = focusItems(group).map(i => i.lngLat);
      if (!pts.length) return;
      const b = pts.reduce((acc, p) => acc.extend(p), new maplibregl.LngLatBounds(pts[0], pts[0]));
      map.fitBounds(b, { padding: 90, duration: 800, maxZoom: 16.5 });
    }

    // ── 표식 누름 ──
    function tap(c) {
      if (c.items.length > 1) { zoomTo(c); return; }
      const it = c.items[0];
      if (it.kind === 'camera') {
        const cam = store.cameras.find(x => x.id === it.id);
        if (cam) {
          fly(lngLat(cam.point), true);
          S.popoverCamera = cam;
          openCase(cam.incidentID, cam.id, false);
          drawCards();
        }
        return;
      }
      if (it.incidentID) openCase(it.incidentID, it.id, !S.openedCase);
      if (!S.openedCase) fly(it.lngLat, true);
    }
    /** 사건 표식을 두 번 누름 — 그 사건의 상황 브리핑을 곁에 띄운다 */
    function openBrief(c) {
      if (c.items.length > 1 || c.items[0].kind !== 'incident') return;
      const inc = store.incidents.find(i => i.id === c.items[0].id);
      if (!inc) return;
      S.popoverCamera = null;
      fly(lngLat(inc.point), true);     // 표식을 화면 가운데로 가져온 뒤 띄운다
      S.briefIncident = inc;
      drawCards();
    }
    function markerMenu(c, ev) {
      if (c.items.length > 1 || c.items[0].kind !== 'unit') return;
      const it = c.items[0];
      const menu = PX.el(`<div class="mp-menu glass"></div>`);
      const add = (text, danger, act) => {
        const b = PX.el(`<button class="mp-menu-item${danger ? ' danger' : ''}">${PX.esc(text)}</button>`);
        b.onclick = () => { menu.remove(); act(); };
        menu.appendChild(b);
      };
      add('지도에서 보기', false, () => fly(it.lngLat, true));
      if (it.incidentID) add('사건에서 삭제', true, () => unassign(it.id));
      else if (S.openedCase) add('이 사건에 배정', false, () => assign(it.id, S.openedCase.reportIDs[0]));
      const box = body.getBoundingClientRect();
      menu.style.left = (ev.clientX - box.left) + 'px';
      menu.style.top = (ev.clientY - box.top) + 'px';
      body.appendChild(menu);
      setTimeout(() => {
        const off = () => { menu.remove(); document.removeEventListener('mousedown', off); };
        document.addEventListener('mousedown', off);
      }, 0);
    }

    // ── 사건 열기 / 배정 ──
    function openCase(incidentID, row, fit) {
      if (!incidentID) return;
      const group = store.caseGroupOf(incidentID);
      if (!group) return;
      backToMap();
      store.select(incidentID);
      if (!S.openedCase || S.openedCase.id !== group.id) {
        S.openedCase = group;
        S.sidebarOpen = true;
        if (fit) fitCase(group);
      }
      S.selectedRowID = row;
      retargetClock();
      drawAll();
    }
    function assign(unitID, incidentID) {
      if (unitID.indexOf('V-') === 0) store.assignVehicle(unitID, incidentID);
      else store.assignOfficer(unitID, incidentID);
      drawAll();
    }
    function unassign(unitID) {
      if (unitID.indexOf('V-') === 0) store.unassignVehicle(unitID);
      else store.unassignOfficer(unitID);
      if (S.selectedRowID === unitID) S.selectedRowID = null;
      drawAll();
    }

    // ── 재생 막대 ──
    function retargetClock() {
      const ids = S.openedCase ? S.openedCase.reportIDs : [store.selectedIncidentID];
      const times = store.incidents.filter(i => ids.indexOf(i.id) >= 0).map(i => i.reportedAt);
      if (!times.length) return;
      times.sort((a, b) => PX.hm(a) - PX.hm(b));
      clock.retarget(times[0]);
    }
    clock.onTick = () => { drawPlay(); drawMarkers(); drawLines(); drawPairLabels(); };

    function drawPlay() {
      const live = clock.isLive && !clock.playing;
      playEl.innerHTML =
        `<button class="mp-play-btn${clock.playing ? ' on' : ''}" data-act="play"
           title="${clock.playing ? '멈춤' : '접수 시각부터 상황을 흘려보냅니다'}">
           ${PX.icon(clock.playing ? 'pause' : 'play')}</button>
         <span class="mp-time${live ? '' : ' accent'} mono">${clock.label}</span>` +
        (tile.isVeryNarrow ? '' :
          `<span class="cap sec">${clock.playing ? '재생 중' : clock.isLive ? '지금' : '되감기'}</span>`) +
        // 손으로 잡아 끌 수 있는 폭이 없으면 슬라이더는 있으나 마나다
        (tile.width > 620
          ? `<input type="range" class="mp-range" min="${clock.span[0]}" max="${clock.span[1]}"
               step="0.05" value="${PX.clamp(clock.now, clock.span[0], clock.span[1])}"
               title="시각을 잡아 끌어 되감습니다">` : '') +
        // 되감아 본 뒤에 돌아올 곳 — 「지금」일 때는 자리를 차지하지 않는다
        (live ? '' : `<button class="mp-now cap" data-act="live" title="지금 상황으로 돌아갑니다">지금</button>`);
    }
    playEl.addEventListener('click', e => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      if (b.dataset.act === 'play') {
        // 인력이 꺼져 있으면 재생해도 움직일 것이 없다 — 눌렀을 때 같이 켠다
        if (!clock.playing && !S.showUnits && !S.openedCase) { S.showUnits = true; drawSidebar(); }
        clock.toggle();
        drawAll();
      } else if (b.dataset.act === 'live') {
        clock.goLive();
        drawAll();
      }
    });
    playEl.addEventListener('input', e => {
      if (!e.target.classList.contains('mp-range')) return;
      const v = +e.target.value;
      if (Math.abs(v - clock.now) <= 0.2) return;   // 저절로 되쓰는 값에 재생이 끊기지 않게
      clock.stop();
      clock.now = v;
      clock.onTick();
    });

    // ── 오른쪽 위 조작 ──
    function drawControls() {
      const kindBtn = KINDS.find(k => k.id === S.kind);
      ctlEl.innerHTML =
        (S.showKindMenu
          ? `<div class="mp-kinds glass">` + KINDS.map(k =>
              `<button class="mp-kind${S.kind === k.id ? ' on' : ''}" data-kind="${k.id}">
                 ${PX.icon(k.icon)}<span class="cap">${k.name}</span></button>`).join('') + `</div>`
          : '') +
        (tile.isTiny ? '' :
          `<div class="mp-ctlgroup glass">
             <button class="mp-ctl" data-act="kind" title="지도 종류">${PX.icon(kindBtn.icon)}</button>
             <hr class="hair">
             <button class="mp-ctl" data-act="loc" title="내 위치로 이동">${PX.icon('locate')}</button>
           </div>`);
      ctlEl.style.padding = (tile.isShort ? 6 : 10) + 'px';
    }
    ctlEl.addEventListener('click', e => {
      const k = e.target.closest('[data-kind]');
      if (k) { S.showKindMenu = false; applyKind(k.dataset.kind); return; }
      const b = e.target.closest('[data-act]');
      if (!b) return;
      if (b.dataset.act === 'kind') { S.showKindMenu = !S.showKindMenu; drawControls(); }
      else if (b.dataset.act === 'loc') geo.trigger();
    });

    // ── 사이드바 ──
    function drawSidebar() {
      const narrow = tile.isNarrow;
      const open = S.sidebarOpen && !narrow;
      sideEl.hidden = !open;
      toggleEl.hidden = open;         // 열려 있을 때는 사이드바 첫 줄의 아이콘을 쓴다
      if (!open) return;
      sideEl.style.width = Math.min(220, Math.max(150, body.clientWidth * 0.32)) + 'px';

      let inner =
        `<div class="mp-side-top"><button class="mp-side-fold" data-act="fold" title="사이드바 접기">${PX.icon('sidebar')}</button></div>
         <div class="mp-search">
           ${PX.icon('search', 'sec')}
           <input type="search" placeholder="장소, 주소 검색" value="${PX.esc(S.query)}">
           ${S.query ? `<button class="mp-clear" data-act="clear">${PX.icon('close')}</button>` : ''}
         </div>
         <div class="mp-scroll">`;

      if (S.results.length) {
        inner += S.results.map((r, i) =>
          `<button class="mp-result" data-result="${i}">
             <b class="lab">${PX.esc(r.name)}</b><span class="cap sec">${PX.esc(r.detail)}</span>
           </button>`).join('');
      } else if (S.openedCase) {
        inner += caseDetail(S.openedCase);
      } else {
        inner += `<div class="cap sec mp-secline">지도</div>` + layerRows();
      }
      inner += `</div>`;
      sideEl.innerHTML = inner;

      const input = sideEl.querySelector('input');
      if (input) {
        input.oninput = e => { S.query = e.target.value; };
        input.onkeydown = e => { if (e.key === 'Enter') search(); };
      }
    }

    function layerRows() {
      const row = (title, icon, on, act, count, extra) =>
        `<button class="mp-layer${on ? ' on' : ''}" data-act="${act}">
           ${PX.icon(icon)}<span class="lab">${title}</span>
           <span class="cap sec">${extra != null ? extra : count}</span></button>`;
      let out =
        `<div class="mp-layer-wrap">
           ${row('사건 위치', 'pin', S.showIncidents, 'lay:inc', store.activeIncidents.length)}
           <button class="mp-fold${S.caseListOpen ? ' open' : ''}" data-act="foldcase" title="사건 목록">
             ${PX.icon('chev-r')}</button>
         </div>`;
      if (S.caseListOpen) {
        out += `<div class="mp-cases">` + store.caseGroups.map(g => {
          const head = store.incidents.find(i => i.id === g.reportIDs[0]);
          return `<button class="mp-case" data-case="${PX.esc(g.id)}">
                    ${PX.dot(head ? head.priority : '일반', 8)}
                    <span class="mp-case-t">
                      <b class="lab">${PX.esc(g.title)}</b>
                      ${g.reportIDs.length > 1 ? `<span class="cap sec">신고 ${g.reportIDs.length}건 묶음</span>` : ''}
                    </span>
                    ${PX.icon('chev-r', 'sec')}
                  </button>`;
        }).join('') + `</div>`;
      }
      out += row('인력·차량', 'officer', S.showUnits, 'lay:units', store.officers.length + store.vehicles.length);
      out += `<button class="mp-layer${S.arMode !== 'off' ? ' on' : ''}" data-act="ar">
                ${PX.icon('glasses')}<span class="lab">AR글래스 캠</span>
                <span class="cap sec">${S.arMode === 'off' ? '' : (S.arMode === 'full' ? '전체' : '보는 중')}</span>
              </button>`;
      out += row('CCTV', 'cctv', S.showCameras, 'lay:cams', store.cameras.length);
      out += `<div class="mp-plain">${PX.icon('send')}<span class="lab">전송·지시</span></div>
              <div class="mp-plain">${PX.icon('history')}<span class="lab">히스토리</span></div>`;
      return out;
    }

    function caseDetail(group) {
      const reports = group.reportIDs.map(id => store.incidents.find(i => i.id === id)).filter(Boolean);
      const officers = [].concat.apply([], group.reportIDs.map(r => store.officersOf(r)));
      const vehicles = [].concat.apply([], group.reportIDs.map(r => store.vehiclesOf(r)));
      const cams = [].concat.apply([], group.reportIDs.map(r => store.camerasOf(r)));
      const head = reports[0];

      const row = (id, color, icon, title, sub, trailing, square) =>
        `<button class="mp-row${S.selectedRowID === id ? ' on' : ''}" data-row="${PX.esc(id)}">
           <span class="mp-row-ic${square ? ' sq' : ''}" style="background:${color}">${PX.icon(icon)}</span>
           <span class="mp-row-t"><b class="lab">${PX.esc(title)}</b><span class="cap sec">${PX.esc(sub)}</span></span>
           ${trailing ? `<span class="cap sec">${PX.esc(trailing)}</span>` : ''}
         </button>`;
      const section = (title, count, rows, addLabel, addKind) =>
        (count > 0 || addLabel)
          ? `<div class="mp-sec"><hr class="hair">
               <div class="mp-sec-h"><span class="cap sec">${title}</span><span class="cap sec">${count}</span></div>
               ${rows}
               ${addLabel ? `<button class="mp-add" data-add="${addKind}">${PX.icon('plus')}<span class="cap">${addLabel}</span></button>` : ''}
             </div>`
          : '';

      return `<button class="mp-back" data-act="back">${PX.icon('chev-l')}<span class="lab">사건 목록</span></button>
        <div class="mp-case-head">${PX.dot(head ? head.priority : '일반', 8)}<b>${PX.esc(group.title)}</b></div>
        <div class="cap sec mp-case-place">${PX.esc(head ? head.place : '')}</div>
        ${group.note ? `<div class="mp-case-note">${PX.icon('link', 'sec')}<span class="cap sec">${PX.esc(group.note)}</span></div>` : ''}
        ${section(reports.length > 1 ? '묶인 신고' : '신고', reports.length,
          reports.map(r => row(r.id, COLOR.incident, 'exclaim', r.type,
            r.id + ' · ' + r.reportedAt + ' 접수 · ' + r.status, null)).join(''))}
        ${section('배정 인력', officers.length,
          officers.map(o => row(o.id, COLOR.unit, 'officer', o.call + ' ' + o.name, o.task,
            o.state === '이동 중' ? '이동' : '현장')).join(''), '인력 추가', 'officer')}
        ${section('차량', vehicles.length,
          vehicles.map(v => row(v.id, COLOR.unit, 'car', v.label, '탑승 ' + v.crew, '현장')).join(''), '차량 추가', 'vehicle')}
        ${section('CCTV', cams.length,
          cams.map(c => row(c.id, COLOR.camera, 'cctv', c.name, c.id + ' · 교통 ' + c.traffic, null, true)).join(''))}`;
    }

    sideEl.addEventListener('click', e => {
      const t = e.target;
      const act = t.closest('[data-act]');
      if (act) {
        const a = act.dataset.act;
        if (a === 'fold') { S.sidebarOpen = false; drawSidebar(); return; }
        if (a === 'clear') { S.query = ''; S.results = []; S.searchPin = null; drawSidebar(); drawMarkers(); return; }
        if (a === 'foldcase') { S.caseListOpen = !S.caseListOpen; drawSidebar(); return; }
        if (a === 'back') { S.openedCase = null; S.selectedRowID = null; retargetClock(); drawAll(); return; }
        if (a === 'ar') { S.arMode = S.arMode === 'off' ? 'pip' : 'off'; drawAR(); drawSidebar(); return; }
        if (a.indexOf('lay:') === 0) {
          const k = a.slice(4);
          if (k === 'inc') {
            S.showIncidents = !S.showIncidents;
            // 켤 때는 사건 표식이 **하나도 잘리지 않게** 지도를 맞춰 준다
            if (S.showIncidents) fitAll(store.incidents.filter(i => i.status !== '종료').map(i => lngLat(i.point)));
          }
          if (k === 'units') S.showUnits = !S.showUnits;
          if (k === 'cams') S.showCameras = !S.showCameras;
          drawSidebar(); drawMarkers();
          return;
        }
      }
      const g = t.closest('[data-case]');
      if (g) {
        const group = store.caseGroups.find(x => x.id === g.dataset.case);
        if (group) {
          S.openedCase = group;
          const head = store.incidents.find(i => i.id === group.reportIDs[0]);
          if (head) store.select(head.id);
          S.selectedRowID = null;
          retargetClock();
          fitCase(group);
          drawAll();
        }
        return;
      }
      const r = t.closest('[data-row]');
      if (r) {
        const id = r.dataset.row;
        S.selectedRowID = id;
        const inc = store.incidents.find(x => x.id === id);
        const o = store.officers.find(x => x.id === id);
        const v = store.vehicles.find(x => x.id === id);
        const c = store.cameras.find(x => x.id === id);
        if (inc) fly(lngLat(inc.point), true);
        else if (o) fly(lngLat(o.point), true);
        else if (v) fly(lngLat(v.point), true);
        else if (c) { fly(lngLat(c.point), true); S.popoverCamera = c; drawCards(); }
        drawSidebar();
        return;
      }
      const add = t.closest('[data-add]');
      if (add) { addMenu(add.dataset.add, add); return; }
      const res = t.closest('[data-result]');
      if (res) {
        const hit = S.results[+res.dataset.result];
        if (hit) {
          S.searchPin = hit.lngLat;
          fly(hit.lngLat, true);
          S.results = [];
          drawSidebar();
          drawMarkers();
        }
      }
    });

    function addMenu(kind, anchor) {
      const pool = kind === 'officer'
        ? store.officers.filter(o => !o.incidentID)
        : store.vehicles.filter(v => !v.incidentID);
      const menu = PX.el(`<div class="mp-menu glass"></div>`);
      if (!pool.length) {
        menu.appendChild(PX.el(`<div class="mp-menu-item sec">${kind === 'officer' ? '대기 중인 인력이 없습니다' : '대기 중인 차량이 없습니다'}</div>`));
      } else {
        pool.forEach(u => {
          const label = kind === 'officer' ? (u.call + ' ' + u.name + ' · ' + u.team) : (u.label + ' · 탑승 ' + u.crew);
          const b = PX.el(`<button class="mp-menu-item">${PX.esc(label)}</button>`);
          b.onclick = () => {
            menu.remove();
            if (S.openedCase) assign(u.id, S.openedCase.reportIDs[0]);
          };
          menu.appendChild(b);
        });
      }
      const box = body.getBoundingClientRect(), a = anchor.getBoundingClientRect();
      menu.style.left = (a.left - box.left) + 'px';
      menu.style.top = (a.bottom - box.top + 4) + 'px';
      body.appendChild(menu);
      setTimeout(() => {
        const off = () => { menu.remove(); document.removeEventListener('mousedown', off); };
        document.addEventListener('mousedown', off);
      }, 0);
    }

    /** 장소 검색 — 애플의 MKLocalSearch 대신 공개 지명 검색을 쓴다 */
    function search() {
      const text = S.query.trim();
      if (!text) { S.results = []; drawSidebar(); return; }
      const b = map.getBounds();
      const url = 'https://nominatim.openstreetmap.org/search?format=json&accept-language=ko&limit=8&q='
        + encodeURIComponent(text)
        + '&viewbox=' + [b.getWest(), b.getNorth(), b.getEast(), b.getSouth()].join(',');
      fetch(url, { headers: { 'Accept': 'application/json' } })
        .then(r => r.json())
        .then(list => {
          S.results = list.map(x => ({
            name: (x.name || x.display_name.split(',')[0]),
            detail: x.display_name,
            lngLat: [+x.lon, +x.lat]
          }));
          drawSidebar();
        })
        .catch(() => { S.results = []; drawSidebar(); });
    }

    // ── 지도 위에 얹는 카드 (CCTV · 사건 브리핑) ──
    /* 표식 자리를 화면 좌표로 바꿔 그 곁에 카드를 세운다.
       아래에 자리가 없으면 위로, 옆으로도 모자라면 안쪽으로 밀어 잘리지 않게 한다. */
    function cardOrigin(pt, card) {
      const gap = 18, edge = 8;
      const W = body.clientWidth, H = body.clientHeight;
      // 사이드바가 펼쳐져 있으면 그 뒤로 숨지 않게 왼쪽 한계를 옮긴다
      const left = (S.sidebarOpen && !tile.isNarrow)
        ? Math.min(220, Math.max(150, W * 0.32)) + 24 : edge;
      const below = pt.y + gap, above = pt.y - card.h - gap;
      const y = (below + card.h <= H - edge || above < edge) ? below : above;
      return {
        x: Math.min(Math.max(pt.x - card.w / 2, left), Math.max(left, W - card.w - edge)),
        y: Math.min(Math.max(y, edge), Math.max(edge, H - card.h - edge))
      };
    }

    function drawCards() {
      if (!S.popoverCamera && !S.briefIncident) { cardEl.innerHTML = ''; return; }
      if (!cardEl.dataset.key || cardEl.dataset.key !== cardKey()) {
        cardEl.dataset.key = cardKey();
        cardEl.innerHTML =
          (S.popoverCamera ? cameraCard(S.popoverCamera) : '') +
          (S.briefIncident ? briefCard(S.briefIncident) : '');
      }
      const cam = cardEl.querySelector('.mp-cam');
      if (cam && S.popoverCamera) {
        const pt = map.project(lngLat(S.popoverCamera.point));
        const o = cardOrigin(pt, { w: cam.offsetWidth, h: cam.offsetHeight });
        cam.style.left = o.x + 'px'; cam.style.top = o.y + 'px';
      }
      const brief = cardEl.querySelector('.mp-brief');
      if (brief && S.briefIncident) {
        const pt = map.project(lngLat(S.briefIncident.point));
        const o = cardOrigin(pt, { w: brief.offsetWidth, h: brief.offsetHeight });
        brief.style.left = o.x + 'px'; brief.style.top = o.y + 'px';
      }
    }
    const cardKey = () => (S.popoverCamera ? S.popoverCamera.id : '-') + '|' + (S.briefIncident ? S.briefIncident.id : '-');
