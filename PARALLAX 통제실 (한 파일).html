<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PARALLAX 지휘통제 콘솔</title>
<!--
  macOS 앱(ParallaxConsole, SwiftUI)을 그대로 웹으로 옮긴 것.
  창 배치·화면 구성·글자 크기까지 Swift 판을 기준으로 맞춘다.
  일반 <script> 로만 불러온다 — file:// 로 열어도 되게 하려는 것이다(ES module 은 막힌다).
-->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.24.0/maplibre-gl.css">
<style>
/* ===== theme.css ===== */
/* Theme.swift 를 그대로 옮긴 값들.
   글자: 본문 16 · 보조 14 · 캡션 12
   색: 긴급 빨강 · 주의 주황 · 일반 회색 (중요도는 원으로만 표시) */

:root {
  /* 글자 (Theme.body / label / caption) */
  --f-body: 16px;
  --f-label: 14px;
  --f-caption: 12px;

  /* 간격 (Theme.blockGap / titleGap / itemGap / inset) */
  --gap-block: 20px;
  --gap-title: 8px;
  --gap-item: 8px;
  --inset: 14px;

  /* 중요도 — 맥 시스템 색과 같은 값 */
  --c-urgent: #ff3b30;
  --c-caution: #ff9500;
  --c-normal: rgba(60, 60, 67, 0.6);

  /* 강조색: macOS 기본 파랑 */
  --accent: #007aff;
  --accent-soft: rgba(0, 122, 255, 0.18);

  /* 바탕·글자 (SwiftUI 의 .primary / .secondary 에 해당) */
  --ink: #000;
  --ink-2: rgba(60, 60, 67, 0.6);
  --ink-3: rgba(60, 60, 67, 0.3);
  --line: rgba(0, 0, 0, 0.11);
  --desk: #f2f2f2;

  /* .regularMaterial 흉내 — 뒤가 비치는 유리 */
  --glass: rgba(246, 246, 246, 0.82);
  --glass-thin: rgba(255, 255, 255, 0.6);
  --blur: saturate(180%) blur(30px);

  --fill-1: rgba(120, 120, 128, 0.12);
  --fill-2: rgba(120, 120, 128, 0.2);
  --radius-win: 18px;
  --font: -apple-system, BlinkMacSystemFont, "Pretendard Variable", Pretendard,
          "Apple SD Gothic Neo", "Segoe UI", system-ui, sans-serif;
}

/* 다크 모드. Swift 판과 같이 상태바 달 단추로 켠다 */
:root[data-theme="dark"] {
  --ink: #fff;
  --ink-2: rgba(235, 235, 245, 0.6);
  --ink-3: rgba(235, 235, 245, 0.3);
  --line: rgba(255, 255, 255, 0.14);
  --desk: #121212;
  --accent: #0a84ff;
  --accent-soft: rgba(10, 132, 255, 0.24);
  --c-urgent: #ff453a;
  --c-caution: #ff9f0a;
  --c-normal: rgba(235, 235, 245, 0.6);
  --glass: rgba(38, 38, 40, 0.78);
  --glass-thin: rgba(58, 58, 60, 0.6);
  --fill-1: rgba(120, 120, 128, 0.24);
  --fill-2: rgba(120, 120, 128, 0.36);
  color-scheme: dark;
}

* { box-sizing: border-box; }

/* 브라우저 기본 규칙 `[hidden]{display:none}` 은 클래스 규칙에 진다.
   우리는 `el.hidden = true` 로 조각을 감추는 곳이 많은데(사이드바·레일·최소화한 창 …),
   그 조각들에 display 를 주는 순간 숨기기가 먹히지 않는다. 여기서 한 번에 못 박는다. */
[hidden] { display: none !important; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  font-family: var(--font);
  font-size: var(--f-label);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

button { font: inherit; color: inherit; }

/* 아이콘: 스프라이트를 선으로 그린다 (SF Symbols 대신) */
.sprite { display: none; }
.ic {
  width: 1em; height: 1em;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
}
.ic .fillnow { fill: currentColor; stroke: none; }

/* 중요도 표시용 색 원 (모양은 항상 원) — PriorityDot */
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.dot.urgent { background: var(--c-urgent); }
.dot.caution { background: var(--c-caution); }
.dot.normal { background: var(--c-normal); }

.sec { color: var(--ink-2); }
.cap { font-size: var(--f-caption); }
.lab { font-size: var(--f-label); }
.mono { font-variant-numeric: tabular-nums; }

hr.hair {
  border: 0;
  border-top: 1px solid var(--line);
  margin: 0;
}

/* 유리 재질. 크기를 끄는 동안에는 .no-glass 를 켜서 흐림을 끈다 —
   흐림을 매 프레임 다시 계산하면 화면이 지직거린다 (Swift 판의 wm.resizing 과 같다) */
.glass {
  background: var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
}
body.resizing .glass {
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
  background: var(--desk);
}

/* 공용 단추 */
.btn {
  border: 0;
  background: transparent;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 9px;
  padding: 0 8px;
  height: 28px;
}
.btn:hover { background: var(--fill-1); }
.btn.on { background: var(--accent); color: #fff; }
.btn.pill { border-radius: 999px; }
.btn.icon { padding: 0; width: 32px; justify-content: center; }

</style>
<style>
/* ===== app.css ===== */
/* 콘솔 껍데기: 상단 상태바 · 왼쪽 런처 · 떠 있는 창들 · 창 배치 독
   ContentView.swift / WindowSystem.swift 의 배치를 그대로 옮긴다. */

#root {
  display: flex;
  flex-direction: column;
  height: 100%;
  position: relative;
  isolation: isolate;
}

/* 바탕: 옅은 그러데이션 (DesktopBackground) */
#root::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(circle at 55% 35%, color-mix(in srgb, var(--accent) 16%, transparent) 0, transparent 60%),
    radial-gradient(circle at 5% 100%, rgba(175, 82, 222, 0.10) 0, transparent 46%),
    var(--desk);
}
/* 왼쪽 아래 보라 빛은 밝을 때만. 어두운 바탕에서는 붉게 번져 창이 탁해 보인다 */
:root[data-theme="dark"] #root::before {
  background:
    radial-gradient(circle at 55% 35%, color-mix(in srgb, var(--accent) 22%, transparent) 0, transparent 60%),
    var(--desk);
}

/* ── 상태바 ─────────────────────────────────────────── */
#statusbar {
  height: 44px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 16px;
  border-bottom: 1px solid var(--line);
  position: relative;
  z-index: 3;
}
.logo {
  display: flex;
  align-items: center;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 0.06em;
  white-space: nowrap;
}
.sb-inc { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.sb-inc b { color: var(--accent); font-size: var(--f-caption); }
.sb-fake {
  font-size: var(--f-caption);
  color: var(--ink-2);
  background: var(--fill-2);
  border-radius: 999px;
  padding: 2px 7px;
  white-space: nowrap;
}
.sb-stats { display: flex; gap: 14px; margin-left: auto; white-space: nowrap; }
.sb-stat { display: flex; gap: 5px; font-size: var(--f-caption); }
.sb-stat b { font-weight: 600; }
.sb-icons { display: flex; gap: 10px; }
.sb-icons .btn { width: 32px; height: 32px; padding: 0; justify-content: center; font-size: 15px; }

/* ── 가운데: 런처 + 작업 영역 ─────────────────────────── */
#middle { flex: 1; display: flex; min-height: 0; position: relative; }

#rail {
  flex: none;
  width: 190px;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  position: relative;
  z-index: 2;
}
.rail-item {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 34px;
  padding: 0 10px;
  border-radius: 10px;
  border: 0;
  background: transparent;
  cursor: pointer;
  font-size: var(--f-label);
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
}
.rail-item .ic { font-size: 17px; width: 18px; }
.rail-item:hover { background: var(--fill-1); }
.rail-item.open { background: var(--fill-1); }
.rail-item.focus { background: var(--accent-soft); }
#rail.compact .rail-item { justify-content: center; padding: 0; }
#rail.compact .rail-item span { display: none; }

#railgrab {
  flex: none;
  width: 8px;
  cursor: col-resize;
  position: relative;
  z-index: 2;
}
#railgrab::after {
  content: "";
  position: absolute;
  top: 0; bottom: 0; left: 50%;
  width: 1px;
  background: var(--line);
}

/* ── 작업 영역과 창 ───────────────────────────────────── */
#desk { flex: 1; position: relative; min-width: 0; overflow: hidden; }

.win {
  position: absolute;
  border-radius: var(--radius-win);
  overflow: hidden;
  border: 0.8px solid rgba(255, 255, 255, 0.14);
  box-shadow: 0 8px 12px rgba(0, 0, 0, 0.14);
}
.win.focus {
  border: 1.2px solid color-mix(in srgb, var(--accent) 30%, transparent);
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.26);
}
body.resizing .win { box-shadow: none; }
/* 자리를 옮기거나 붙을 때만 움직임을 준다 — 끄는 동안에는 손을 그대로 따라와야 한다 */
.win.settling { transition: left .22s cubic-bezier(.2,.8,.2,1), top .22s cubic-bezier(.2,.8,.2,1),
                            width .22s cubic-bezier(.2,.8,.2,1), height .22s cubic-bezier(.2,.8,.2,1); }
.win.dragging { opacity: .92; }

/* 제목줄은 **칸을 차지하지 않는다**. 내용 위에 떠 있고 바탕도 없다 —
   지도·3D 가 창을 가득 쓰게 하려는 것이다.
   빈 자리는 누름을 받지 않고(`pointer-events: none`) 아래 내용이 그대로 받는다.
   이름표와 단추만 유리 알약으로 떠 있고, 창에 손을 올렸을 때만 나타난다. */
.win-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 46px;
  display: flex;
  align-items: center;
  padding: 8px;
  z-index: 6;
  pointer-events: none;
  opacity: 0;
  transition: opacity .15s ease;
}
/* 창 **위쪽**에 손이 올라왔을 때만 뜬다 (shell.js 가 .chrome 을 붙였다 뗀다).
   제목줄은 누름을 받지 않으므로 :hover 로는 잡을 수 없어 손 자리를 직접 잰다.
   끌고 있는 동안에는 손이 어디에 있든 남아 있어야 한다. */
.win.chrome .win-bar, .win.dragging .win-bar { opacity: 1; }

.win-title {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 7px;
  height: 30px;
  padding: 0 11px;
  max-width: 60%;
  border-radius: 999px;
  cursor: grab;
  user-select: none;
  background: var(--glass-thin);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid rgba(255, 255, 255, 0.18);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
}
.win-title:active { cursor: grabbing; }
.win-title .ic { font-size: 14px; width: 17px; flex: none; }
.win-title b {
  font-size: var(--f-label);
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
/* 칸이 좁아지면 이름부터 떨어내고 아이콘만 남긴다 */
.win.tiny .win-title b { display: none; }

.win-btns {
  pointer-events: auto;
  margin-left: auto;
  display: flex;
  gap: 2px;
  padding: 2px;
  border-radius: 999px;
  background: var(--glass-thin);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid rgba(255, 255, 255, 0.18);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
}
.win-btns button {
  width: 26px; height: 26px;
  border: 0; border-radius: 50%;
  background: transparent;
  cursor: pointer;
  display: grid; place-items: center;
  font-size: 11px;
}
.win-btns button:hover { background: var(--fill-2); }

/* 화면 쪽 CSS 가 이 칸에 `position: relative` 를 주는 곳이 있다(.mp-root 등).
   나중에 불리는 파일이 이기므로 자식 선택자로 한 단계 세게 잡아 둔다 */
.win > .win-body { position: absolute; inset: 0; overflow: hidden; }

/* 놓을 자리 미리보기 (DropPreview) */
#drop-preview {
  position: absolute;
  border-radius: 18px;
  background: color-mix(in srgb, var(--accent) 16%, transparent);
  border: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
  pointer-events: none;
  z-index: 9999;
  transition: left .09s ease-out, top .09s ease-out, width .09s ease-out, height .09s ease-out;
}

/* 창과 창 사이 경계 (DividerHandle) — 가는 띠만 덮어 창 안 클릭을 가로채지 않는다 */
.divider {
  position: absolute;
  z-index: 9998;
  display: grid;
  place-items: center;
}
.divider.v { cursor: col-resize; width: 12px; }
.divider.h { cursor: row-resize; height: 12px; }
.divider::after {
  content: "";
  border-radius: 999px;
  background: transparent;
  transition: background .12s ease;
}
.divider.v::after { width: 4px; height: 44px; }
.divider.h::after { width: 44px; height: 4px; }
.divider:hover::after { background: color-mix(in srgb, var(--ink) 30%, transparent); }
.divider.on::after { background: color-mix(in srgb, var(--ink) 45%, transparent); }

/* ── 창 배치 독 ───────────────────────────────────────────
   하단 바를 없애고 이것만 남겼다. 늘 떠 있으면 화면을 먹으므로
   작업 영역 **아래쪽에 손이 왔을 때만** 떠오른다 (맥 독과 같은 방식). */
#dock {
  position: absolute;
  left: 50%;
  bottom: 14px;
  transform: translateX(-50%) translateY(10px);
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 5px;
  border-radius: 999px;
  z-index: 10000;
  opacity: 0;
  pointer-events: none;
  transition: opacity .18s ease, transform .18s cubic-bezier(.2, .8, .2, 1);
  background: var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid rgba(255, 255, 255, 0.22);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.25);
}
/* 창 사이 틈에 깔리는 얇은 띠 — 눌림은 받지만 창 안 내용을 가리지 않는다 */
#dock-zone {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 12px;
  z-index: 9997;
}

#dock.on {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
  pointer-events: auto;
}
.dock-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 32px;
  padding: 0 13px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  cursor: pointer;
  font-size: var(--f-caption);
  font-weight: 500;
  white-space: nowrap;
}
.dock-btn .ic { font-size: 14px; }
.dock-btn:hover { background: var(--fill-1); }
.dock-btn:active { background: var(--fill-2); }

</style>
<style>
/* ===== screen-overview.css ===== */
/* 전체 상황 (OverviewScreen.swift)
   크기에 따라 달라지는 수치는 screen-overview.js 가 .ov-root 에 CSS 변수로 내려 준다:
   --ov-inset  --ov-blockgap  --ov-cardinset  --ov-mgap  --ov-secgap
   --ov-rowpad --ov-nametop-pb */

.ov-root {
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  /* 기본값 — build() 가 곧바로 덮어쓴다 */
  --ov-inset: var(--inset);
  --ov-blockgap: var(--gap-block);
  --ov-cardinset: 20px;
  --ov-mgap: 16px;
  --ov-secgap: 16px;
  --ov-rowpad: 10px;
  --ov-nametop-pb: 6px;
}

.ov-pad { padding: var(--ov-inset); }

/* 덩어리 사이 선 — Divider().padding(.vertical, tile.blockGap)
   theme.css 의 `hr.hair` 가 margin:0 이고 우선순위가 더 높아, 같은 세기로 눌러 준다 */
hr.ov-blockdiv { margin: var(--ov-blockgap) 0; }

/* ── 상황 요약 줄 ────────────────────────────────────────
   FlexRow = LazyVGrid(.adaptive(minimum: 120)). 칸 폭이 같아야 숫자가 한 줄로 선다. */
.ov-summary {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  column-gap: var(--ov-mgap);
  row-gap: 6px;
  align-items: center;
}
.ov-metric {
  display: flex;
  align-items: center;
  min-width: 0;
}
.ov-m-t {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* 값을 칸 오른쪽 끝에 붙인다 (Spacer(minLength: 4)) */
.ov-m-v {
  margin-left: auto;
  padding-left: 4px;
  font-size: var(--f-label);
  font-weight: 600;
  flex: none;
}

/* 점 거터 — 점이 있든 없든 글자는 같은 x 에서 시작한다 */
.ov-gutter {
  width: 22px;
  flex: none;
  display: inline-flex;
  align-items: center;
}

/* ── 구역 제목 (사건 브리핑 / 사건 목록) ─────────────────── */
.ov-sec-title { display: block; padding-bottom: var(--ov-secgap); }

/* ── 사건 브리핑 카드 ────────────────────────────────────
   바탕은 카드 하나로 통일한다 — 구역은 얇은 선과 여백으로만 가른다 */
.ov-card {
  width: 100%;
  background: color-mix(in srgb, var(--ink) 5%, transparent);
  border: 1px solid color-mix(in srgb, var(--ink) 6%, transparent);
  border-radius: 14px;
  overflow: hidden;
}

/* ① 사건 이름 + 긴급 표시 + 사건번호 */
.ov-card-head {
  display: flex;
  align-items: baseline;
  padding: var(--ov-cardinset) var(--ov-cardinset) 14px;
}
/* 이름은 길면 접힌다 (Swift 쪽에도 lineLimit 이 없다) */
.ov-inc-type {
  font-size: var(--f-body);
  font-weight: 600;
  min-width: 0;
  overflow-wrap: anywhere;
}
.ov-head-right {
  margin-left: auto;
  padding-left: 8px;    /* Spacer(minLength: 8) */
  flex: none;
  display: flex;
  align-items: baseline;
  white-space: nowrap;
}
.ov-prio .dot {
  margin-right: 5px;
  vertical-align: middle;
}
.ov-inc-id { padding-left: 10px; }

/* ② 요약 한 문장 — 선을 사이에 두므로 아래 7 (위 간격 14 와 같아진다) */
.ov-card-sum {
  font-size: var(--f-label);
  line-height: 1.5;          /* lineSpacing(4) */
  padding: 0 var(--ov-cardinset) 7px;
}
/* 아주 낮으면 2줄로 자른다 */
.ov-root.is-very-short .ov-card-sum {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  overflow: hidden;

<style>
/* ===== screen-space.css ===== */

<style>
/* ===== screen-transmit.css ===== */

}
.tx-dd:hover { background: var(--fill-1); }
.tx-dd.open { background: var(--fill-2); }
.tx-dd-label {
  flex: 1;
  min-width: 0;
  font-size: var(--f-label);
  font-weight: 500;

  overflow: hidden;
  text-overflow: ellipsis;
}
.tx-dd-chev { font-size: 9px; opacity: .65; stroke-width: 2.2; }
.tx-dd-target { width: var(--tx-dd-w); flex: none; }
.tx-kind { width: var(--tx-kind-w); flex: none; align-self: flex-start; }
/* 낮은 창에서는 중요도 고르기를 접는다 — 입력칸과 보내기가 먼저 살아야 한다 */

  font-weight: 700;

  text-align: center;

/* ── 드롭다운·오른쪽 단추 메뉴 ─────────────────────────── */

.tx-readbtn {

.tx-composer-wrap { flex: none; padding: 12px; }

/* 바깥 상자는 두지 않는다 — 중요도 단추와 입력칸이 이미 제 모양을 갖고 있어

  gap: 6px;
  padding: 0;
  background: transparent;
}

.tx-input-row { display: flex; align-items: flex-end; gap: 8px; }
.tx-input {

  min-width: 0;
  resize: none;
  border: 0;
  outline: 0;
  border-radius: 10px;
  padding: 8px 10px;

/* 단추는 절대 줄지 않는다 */

<style>
/* ===== screen-handover.css ===== */
/* 기록·회의록 (HandoverScreen.swift) — ho-
   사건 처리 단계 (ProgressScreen.swift) — pg-
   색·글자·여백은 theme.css 의 변수만 쓴다 (직접 적으면 다크 모드가 깨진다).
   창 크기에 따라 달라지는 값(inset, blockGap, 이음줄 길이)은 js 가 인라인으로 넣는다. */

/* ═══ 기록·회의록 ═══════════════════════════════════════════ */

.ho-root { height: 100%; }

/* 창 안쪽은 넘치면 잘리므로(overflow:hidden) 스크롤은 여기서 직접 만든다 —
   Swift 판의 ScrollView 자리다 */
.ho-scroll {
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
}

/* 여백을 스크롤 상자가 아니라 안쪽 칸에 준다.
   상자에 주면 브라우저에 따라 아래쪽 여백이 사라진다 */
.ho-pad {
  display: flex;
  flex-direction: column;
  align-items: stretch;
}

/* ── 머리 (VStack spacing 6) ── */
.ho-head { display: flex; flex-direction: column; gap: 6px; }
.ho-title { display: flex; align-items: center; gap: var(--gap-item); }
.ho-id { font-size: var(--f-body); font-weight: 600; }

/* ── 덩어리 (VStack spacing Theme.titleGap) ── */
.ho-sec { display: flex; flex-direction: column; gap: var(--gap-title); }
.ho-h2 { font-size: var(--f-label); font-weight: 600; }

/* ── 조치 기록 한 줄 (HStack spacing 8) ── */
.ho-row { display: flex; align-items: center; gap: var(--gap-item); }

/* SF Symbols 의 circle / checkmark.circle.fill 자리.
   스프라이트에 빈 동그라미가 없어 테두리 원을 직접 그리고, 완료일 때만 check 아이콘을 채운다 */
.ho-chk {
  flex: none;
  width: 15px;
  height: 15px;
  padding: 0;
  border: 1.5px solid var(--ink-2);
  border-radius: 50%;
  background: transparent;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: var(--ink-2);
}
.ho-chk:hover { border-color: var(--accent); }
.ho-chk.on {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;   /* 강조색 위의 체크 표시 — 다크 모드에서도 흰색이 맞다 */
}
.ho-chk.on .ic { stroke-width: 2.6; }

.ho-act { font-size: var(--f-label); }
/* strikethrough(color: .secondary) — 글자는 본문색, 줄만 보조색 */
.ho-act.done {
  text-decoration: line-through;
  text-decoration-color: var(--ink-2);
}

/* ── 회의록 요약 ── */
/* Swift 의 lineSpacing(3): 줄과 줄 사이를 3pt 벌린다 */
.ho-sum {
  font-size: var(--f-label);
  line-height: calc(var(--f-label) * 1.2 + 3px);
}

/* 위험 요소 (HStack alignment .top spacing 6, 점은 .padding(.top, 5)) */
.ho-haz { display: flex; align-items: flex-start; gap: 6px; }
.ho-haz .dot { margin-top: 5px; }

/* ═══ 사건 처리 단계 ═════════════════════════════════════════ */

.pg-root {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: stretch;
}

/* 머리줄 (HStack spacing 8) */
.pg-bar { display: flex; align-items: center; gap: var(--gap-item); flex: none; }
.pg-id { font-size: var(--f-label); font-weight: 600; }
.pg-spacer { flex: 1 1 auto; }

.pg-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
.pg-list { padding: 10px 0; }   /* VStack .padding(.vertical, 10) */

/* 단계 한 줄 (HStack alignment .top spacing 10) — 좌우 여백은 js 가 넣는다 */
.pg-row { display: flex; align-items: flex-start; gap: 10px; }

/* 왼쪽 점과 이음줄 (VStack spacing 0, .padding(.top, 5)) */
.pg-rail { display: flex; flex-direction: column; align-items: center; padding-top: 5px; flex: none; }
.pg-node {
  width: 10px; height: 10px; border-radius: 50%;
  /* 아직 오지 않은 단계 — Swift: Color.secondary.opacity(0.35) */
  background: color-mix(in srgb, var(--ink-2) 35%, transparent);

.pg-node.on { background: var(--accent); }
.pg-line {
  width: 2px;

  background: color-mix(in srgb, var(--ink-2) 25%, transparent);

.pg-line.past { background: color-mix(in srgb, var(--accent) 50%, transparent); }

/* 오른쪽 글 (VStack alignment .leading spacing 3) */
.pg-txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1 1 auto; }
.pg-name { font-size: var(--f-label); font-weight: 400; }
.pg-name.now { font-weight: 600; }   /* 지금 단계만 굵게 */

/* 발치 단추줄 (HStack spacing 8) */
.pg-foot { display: flex; align-items: center; gap: var(--gap-item); flex: none; }

/* macOS 기본 Button / .borderedProminent 자리 */
.pg-btn {
  font-size: var(--f-label);
  border: 0;
  border-radius: 7px;
  padding: 0 12px;
  height: 26px;
  background: var(--fill-1);
  color: var(--ink);
  cursor: pointer;
}
.pg-btn:hover:not(:disabled) { background: var(--fill-2); }
.pg-btn.primary { background: var(--accent); color: #fff; }
.pg-btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
